<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>平凡去沖繩</title>
    
    <!-- 1. 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .input-standard { width: 100% !important; display: block; appearance: none; -webkit-appearance: none; box-sizing: border-box; }
        .custom-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            padding-right: 2.5rem;
        }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #f8fafc; color: #64748b; z-index: 1000; flex-direction: column; text-align: center; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="loading-screen">
        <p class="text-xl font-bold mb-2">正在載入沖繩之旅...🌊</p>
        <p class="text-xs">呼吸一下，馬上就好...</p>
    </div>

    <!-- 
      ========================================
      Firebase 設定區塊
      ========================================
    -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        // 你的 Config
        const firebaseConfig = {
            apiKey: "AIzaSyA5MRIK9yxJ_XNRIfgnLdXjRBoLFQWr8o0",
            authDomain: "okinawa-financial-sheet.firebaseapp.com",
            projectId: "okinawa-financial-sheet",
            storageBucket: "okinawa-financial-sheet.firebasestorage.app",
            messagingSenderId: "1032242385806",
            appId: "1:1032242385806:web:7fa5753a22d4e45f934adf",
            measurementId: "G-33EEBGS9F3"
        };

        // 初始化 Firebase
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            console.log("Firebase initialized successfully");
        } catch (e) {
            console.error("Firebase initialization failed. Did you update the config?", e);
        }

        window.firebaseModules = {
            auth, 
            db,
            signInAnonymously, 
            onAuthStateChanged,
            collection, 
            doc, 
            setDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            writeBatch
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const APP_ID = "okinawa_2025"; 

        const removeLoading = () => {
            const el = document.getElementById('loading-screen');
            if(el) el.style.display = 'none';
        };

        // --- Icons ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Plus: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>,
            Trash2: (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>,
            Users: (p) => <IconBase {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            LayoutDashboard: (p) => <IconBase {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconBase>,
            Edit2: (p) => <IconBase {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>,
            Settings: (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            Globe: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"/></IconBase>,
            RefreshCw: (p) => <IconBase {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>,
            CheckCircle: (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            FileSpreadsheet: (p) => <IconBase {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></IconBase>,
            HelpCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></IconBase>,
            X: (p) => <IconBase {...p}><path d="M18 6 6 18"/><path d="M6 6 18 18"/></IconBase>,
            PieChart: (p) => <IconBase {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>,
            ArrowRight: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></IconBase>,
            ChevronDown: (p) => <IconBase {...p}><path d="m6 9 6 6 6-6"/></IconBase>,
            ChevronUp: (p) => <IconBase {...p}><path d="m18 15-6-6-6 6"/></IconBase>,
            Save: (p) => <IconBase {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            User: (p) => <IconBase {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>,
            Alert: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>,
            Wallet: (p) => <IconBase {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></IconBase>,
            ArrowLeftRight: (p) => <IconBase {...p}><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></IconBase>
        };
        const { Plus, Trash2, LayoutDashboard, Edit2, Settings, Globe, RefreshCw, CheckCircle, FileSpreadsheet, X, PieChart, ArrowRight, ChevronDown, ChevronUp, Save, Wallet, ArrowLeftRight, Alert } = Icons;

        const INITIAL_USERS = [ { id: '1', name: '陳浚愷' }, { id: '2', name: '許瀅珊' }, { id: '3', name: '黃韻庭' }, { id: '4', name: '楊予瑄' }, { id: '5', name: '侯宇薪' } ];
        const PUBLIC_FUND_ID = 'public_fund'; 

        function App() {
            const [fb, setFb] = useState(null);
            const [users] = useState(INITIAL_USERS);
            const [expenses, setExpenses] = useState([]); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currentUser, setCurrentUser] = useState(null);
            const [viewingUserId, setViewingUserId] = useState(''); 
            const [exchangeRate, setExchangeRate] = useState(0.22);
            const [displayCurrency, setDisplayCurrency] = useState('TWD'); 
            
            // 預設收合
            const [isGeneralOpen, setIsGeneralOpen] = useState(false);
            const [isPersonalOpen, setIsPersonalOpen] = useState(false); 
            const [isDebtsOpen, setIsDebtsOpen] = useState(false);
            const [isFundDetailsOpen, setIsFundDetailsOpen] = useState(false);
            
            const [editingExpenseId, setEditingExpenseId] = useState(null);
            const [editingGroupIds, setEditingGroupIds] = useState(null); 
            const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });
            const [confirmDelete, setConfirmDelete] = useState({ show: false, expense: null });
            const [isSaving, setIsSaving] = useState(false);

            // 預設付款人為公費
            const [formData, setFormData] = useState({
                title: '', inputAmount: '', currency: 'TWD', 
                payers: [PUBLIC_FUND_ID], 
                involved: INITIAL_USERS.map(u=>u.id), 
                splitMode: 'equal', 
                customDetails: {}, 
                date: new Date().toISOString().split('T')[0], 
                amountType: 'per_person' // 'per_person' or 'total'
            });
            const [memoizedTitle, setMemoizedTitle] = useState('');

            const [sheetUrl, setSheetUrl] = useState(''); 
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState(null); 

            // Derived state
            const isMultiPayer = formData.payers && formData.payers.length > 1;
            const isFundPayer = formData.payers && formData.payers.includes(PUBLIC_FUND_ID);

            const showToast = (msg, type = 'error') => {
                setToast({ show: true, msg, type });
                setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3000);
            };

            const formatMoney = (amountInTwd) => {
                const isNegative = amountInTwd < 0;
                const absAmount = Math.abs(amountInTwd);
                const prefix = isNegative ? '-' : '';
                
                if (displayCurrency === 'TWD') {
                    return `${prefix}$${Math.round(absAmount).toLocaleString()}`;
                } else {
                    return `${prefix}¥${Math.round(absAmount / exchangeRate).toLocaleString()}`;
                }
            };

            const formatPublicFundJPY = (amountJpy, amountTwd) => {
                if (displayCurrency === 'JPY') {
                    const totalJpy = amountJpy + (amountTwd / exchangeRate);
                    const isNegative = totalJpy < 0;
                    return `${isNegative ? '-' : ''}¥${Math.round(Math.abs(totalJpy)).toLocaleString()}`;
                } else {
                    const totalTwd = (amountJpy * exchangeRate) + amountTwd;
                    const isNegative = totalTwd < 0;
                    return `${isNegative ? '-' : ''}$${Math.round(Math.abs(totalTwd)).toLocaleString()}`;
                }
            };
            
            // KEY FIX: Display Logic to respect original input
            const getDisplayAmount = (itemAmountTwd, itemInputAmount, itemCurrency) => {
                const isNegative = itemAmountTwd < 0;
                
                if (displayCurrency === itemCurrency) {
                    if (itemInputAmount !== null && itemInputAmount !== undefined && !isNaN(itemInputAmount)) {
                        return `${isNegative ? '-' : ''}${itemCurrency === 'JPY' ? '¥' : '$'}${Math.round(parseFloat(itemInputAmount)).toLocaleString()}`;
                    } else {
                        // Safe fallback just in case
                        let val = Math.abs(itemAmountTwd);
                        if (itemCurrency === 'JPY') {
                            val = val / exchangeRate;
                            return `${isNegative ? '-' : ''}¥${Math.round(val).toLocaleString()}`;
                        } else {
                            return `${isNegative ? '-' : ''}$${Math.round(val).toLocaleString()}`;
                        }
                    }
                } else {
                    return formatMoney(itemAmountTwd);
                }
            };

            useEffect(() => {
                const check = setInterval(() => {
                    if (window.firebaseModules && window.firebaseModules.auth) {
                        clearInterval(check);
                        setFb(window.firebaseModules);
                        const { auth, signInAnonymously, onAuthStateChanged } = window.firebaseModules;
                        signInAnonymously(auth).catch(e => {
                            console.error("Auth Error:", e);
                            showToast("登入失敗，請檢查 Firebase Auth 設定", "error");
                        });
                        onAuthStateChanged(auth, (user) => {
                            if(user) setCurrentUser(user);
                            removeLoading();
                        });
                    }
                }, 100);
                return () => clearInterval(check);
            }, []);

            useEffect(() => {
                if (!currentUser || !fb) return;
                const { db, collection, onSnapshot, doc } = fb;
                const expensesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'expenses');
                const settingsDoc = doc(db, 'artifacts', APP_ID, 'public', 'data', 'appSettings', 'gasConfig');

                const unsubExpenses = onSnapshot(expensesRef, (snapshot) => {
                    let newExpenses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // 修正排序：日期相同時，新建立的在上面 (createdAt desc)
                    newExpenses.sort((a, b) => {
                        const dateA = new Date(a.date);
                        const dateB = new Date(b.date);
                        if (dateB.getTime() !== dateA.getTime()) {
                            return dateB - dateA;
                        }
                        const createdA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                        const createdB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                        return createdB - createdA;
                    });
                    setExpenses(newExpenses);
                }, (err) => {
                    console.error("Firestore Error:", err);
                    showToast("資料庫連線失敗，請檢查 Firestore Rules", "error");
                });

                const unsubSettings = onSnapshot(settingsDoc, (doc) => {
                    if (doc.exists()) { setSheetUrl(doc.data().url || ''); }
                });

                return () => { unsubExpenses(); unsubSettings(); };
            }, [currentUser, fb]);

            useEffect(() => {
                const fetchRate = async () => {
                    try {
                        const res = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                        const data = await res.json();
                        if (data?.rates?.TWD) setExchangeRate(data.rates.TWD);
                    } catch (e) { console.error(e); }
                };
                fetchRate();
            }, []);

            useEffect(() => {
                if (activeTab === 'add' && !editingExpenseId && !editingGroupIds) {
                    setMemoizedTitle('');
                } else if (activeTab === 'add' && (editingExpenseId || editingGroupIds)) {
                    setMemoizedTitle(formData.title);
                }
            }, [activeTab, editingExpenseId, editingGroupIds]);

            const stats = useMemo(() => {
                const bal = {}; const share = {};
                const pfJpy = { val: 0 }; 
                const pfTwd = { val: 0 };

                users.forEach(u => { bal[u.id] = 0; share[u.id] = 0; });
                bal[PUBLIC_FUND_ID] = 0; 

                expenses.forEach(exp => {
                    const paidBy = exp.payer; 
                    const amountTwd = parseFloat(exp.amountTwd || 0);
                    const inputAmt = parseFloat(exp.inputAmount || 0); 
                    const isJpy = exp.currency === 'JPY';

                    if (bal[paidBy] !== undefined) bal[paidBy] += amountTwd;
                    
                    if (exp.splitMode === 'fund_topup') {
                        bal[PUBLIC_FUND_ID] -= amountTwd;
                        if (isJpy) pfJpy.val += inputAmt; else pfTwd.val += inputAmt;
                    } else if (exp.splitMode === 'personal') {
                        if (share[paidBy] !== undefined) { share[paidBy] += amountTwd; bal[paidBy] -= amountTwd; }
                    } else if (exp.splitMode === 'custom' && exp.customDetails) {
                        Object.entries(exp.customDetails).forEach(([uid, val]) => {
                            const s = parseFloat(val);
                            if (share[uid] !== undefined) { share[uid] += s; bal[uid] -= s; }
                        });
                    } else {
                        const count = exp.involved.length; 
                        const split = amountTwd / count;
                        exp.involved.forEach(uid => { 
                            if (share[uid] !== undefined) { share[uid] += split; bal[uid] -= split; } 
                        });
                    }

                    if (paidBy === PUBLIC_FUND_ID) {
                        if (isJpy) pfJpy.val -= inputAmt; else pfTwd.val -= inputAmt;
                    }
                });
                
                return { 
                    balances: bal, 
                    totalShare: share, 
                    publicFundBalance: -(bal[PUBLIC_FUND_ID] || 0),
                    publicFundJpy: pfJpy.val,
                    publicFundTwd: pfTwd.val
                };
            }, [users, expenses]);

            const createGroupedList = (expenseList, ignorePayer = false) => {
                const grouped = [];
                const map = new Map();
                
                expenseList.forEach(item => {
                    const key = `${item.date}-${item.title}-${item.inputAmount}-${item.currency}-${item.splitMode}-${ignorePayer ? 'merged' : item.payer}`;
                    if (!map.has(key)) {
                        map.set(key, { ...item, items: [], totalGroupAmount: 0, totalInputAmount: 0, isGroup: false });
                    }
                    const group = map.get(key);
                    group.items.push(item);
                    group.totalGroupAmount += parseFloat(item.amountTwd);
                    group.totalInputAmount += parseFloat(item.inputAmount || 0);
                });
                
                map.forEach(group => {
                    if (group.items.length > 1) {
                        group.isGroup = true;
                    }
                    grouped.push(group);
                });
                
                return grouped.sort((a, b) => {
                    const dateA = new Date(a.date);
                    const dateB = new Date(b.date);
                    if (dateB.getTime() !== dateA.getTime()) return dateB - dateA;
                    // Sort groups by newest item in them
                    const maxCreatedA = Math.max(...a.items.map(i => i.createdAt ? new Date(i.createdAt).getTime() : 0));
                    const maxCreatedB = Math.max(...b.items.map(i => i.createdAt ? new Date(i.createdAt).getTime() : 0));
                    return maxCreatedB - maxCreatedA;
                });
            };

            const groupedExpenses = useMemo(() => createGroupedList(expenses, true), [expenses]);
            const publicFundExpenses = useMemo(() => createGroupedList(expenses.filter(e => e.payer === PUBLIC_FUND_ID || e.splitMode === 'fund_topup'), true), [expenses]);
            
            const myExpenses = useMemo(() => {
                if (!viewingUserId) return [];
                const rawMyExpenses = expenses.filter(e => e.payer === viewingUserId || e.involved.includes(viewingUserId));
                return createGroupedList(rawMyExpenses, false);
            }, [expenses, viewingUserId]);

            const debts = useMemo(() => {
                let debtors = []; let creditors = [];
                const pfBalance = stats.balances[PUBLIC_FUND_ID] || 0;
                const splitPf = pfBalance / users.length; 
                
                const adjusted = { ...stats.balances };
                delete adjusted[PUBLIC_FUND_ID]; 
                
                users.forEach(u => { adjusted[u.id] += splitPf; });
                
                Object.entries(adjusted).forEach(([id, amt]) => {
                    const r = Math.round(amt);
                    if (r < -1) debtors.push({ id, amount: r });
                    if (r > 1) creditors.push({ id, amount: r });
                });
                
                debtors.sort((a,b) => a.amount - b.amount); creditors.sort((a,b) => b.amount - a.amount);
                
                const txs = []; let i=0; let j=0;
                while(i < debtors.length && j < creditors.length) {
                    const d = debtors[i]; const c = creditors[j];
                    const amt = Math.min(Math.abs(d.amount), c.amount);
                    if (amt > 0) txs.push({ from: users.find(u=>u.id===d.id)?.name, to: users.find(u=>u.id===c.id)?.name, amount: amt }); 
                    d.amount += amt; c.amount -= amt;
                    if (Math.abs(d.amount) < 1) i++; if (c.amount < 1) j++;
                }
                return txs;
            }, [stats.balances, users]);

            const togglePayer = (uid) => {
                const currentPayers = formData.payers || [];
                if (uid === PUBLIC_FUND_ID) {
                    setFormData(prev => ({
                        ...prev, 
                        payers: [PUBLIC_FUND_ID], 
                        splitMode: 'equal', 
                        involved: INITIAL_USERS.map(u => u.id), 
                        title: '' 
                    })); 
                    return;
                }
                
                let newPayers = formData.payers.includes(PUBLIC_FUND_ID) ? [] : [...formData.payers];
                if (newPayers.includes(uid)) {
                    if (newPayers.length > 1) newPayers = newPayers.filter(id => id !== uid);
                } else {
                    newPayers.push(uid);
                }
                
                let newSplitMode = formData.splitMode;
                let newTitle = formData.title; 
                
                // Mode Logic Switch
                if (newPayers.length > 1) {
                    // FIX: Default to Separate Pay when multi-select
                    if (formData.payers.length <= 1) {
                        newSplitMode = 'separate_pay'; 
                        newTitle = memoizedTitle; // Keep user title for separate pay
                    }
                } else {
                    // Back to Single Payer
                    if (formData.payers.length > 1) {
                        newSplitMode = 'equal';
                        newTitle = memoizedTitle; // Restore user title
                    }
                    // FIX: If we were in fund_topup (single payer mode), keep it locked
                    if (newSplitMode === 'fund_topup') {
                        newTitle = '上繳公費';
                    }
                }

                setFormData(prev => ({...prev, payers: newPayers, splitMode: newSplitMode, title: newTitle}));
            };

            const toggleInvolved = (uid) => {
                if (formData.payers.includes(PUBLIC_FUND_ID)) return;
                const cur = formData.involved;
                setFormData({...formData, involved: cur.includes(uid) ? (cur.length>1?cur.filter(id=>id!==uid):cur) : [...cur, uid]}); 
            };

            const toggleSplitMode = (mode) => {
                let newTitle = formData.title;
                if (mode === 'fund_topup') {
                    newTitle = '上繳公費';
                } else if (mode === 'separate_pay' || mode === 'personal' || mode === 'equal') {
                    // Restore title when leaving topup mode
                    if (formData.splitMode === 'fund_topup') {
                        newTitle = memoizedTitle; 
                    }
                }
                setFormData(prev => ({...prev, splitMode: mode, title: newTitle}));
            };

            const saveExpense = async () => {
                if (!fb || isSaving) return; 

                if (!formData.title.trim()) {
                    showToast('請輸入項目名稱！', 'error');
                    return;
                }

                if (!formData.inputAmount || parseFloat(formData.inputAmount) <= 0) {
                     showToast('請輸入有效金額！', 'error');
                     return;
                }
                
                if (formData.payers.length === 0) return;

                setIsSaving(true); 

                const { collection, doc, writeBatch, db } = fb;
                const batch = writeBatch(db);

                const inputVal = parseFloat(formData.inputAmount);
                
                // --- UNIVERSAL CALCULATION LOGIC (V7.0) ---
                // Determine divisor based on context to get Per Person Amount
                let count = 1;
                
                if (formData.splitMode === 'separate_pay' || formData.splitMode === 'fund_topup') {
                    // Multi-payer context: count is number of payers
                    count = formData.payers.length;
                } else if (formData.payers.includes(PUBLIC_FUND_ID)) {
                    // Public Fund context: Always 5 people
                    count = INITIAL_USERS.length;
                } else if (formData.splitMode === 'equal') {
                    // Single Payer / Equal Split context: count is involved users
                    count = formData.involved.length;
                }

                let finalInputPerRecord = inputVal;
                let finalInputTotal = inputVal;

                if (formData.amountType === 'total') {
                    // User entered Total -> Calculate Per Person
                    finalInputPerRecord = inputVal / count;
                    finalInputTotal = inputVal;
                } else {
                    // User entered Per Person -> Calculate Total
                    finalInputPerRecord = inputVal;
                    finalInputTotal = inputVal * count;
                }

                // Convert to TWD
                // Note: We use the calculated Per Record amount for conversion base to keep unit accuracy
                const finalTwdPerRecord = formData.currency === 'JPY' ? Math.round(finalInputPerRecord * exchangeRate) : finalInputPerRecord;
                const finalTwdTotal = formData.currency === 'JPY' ? Math.round(finalInputTotal * exchangeRate) : finalInputTotal;

                // --- END CALCULATION ---
                
                if (editingGroupIds) {
                    editingGroupIds.forEach(id => batch.delete(doc(db, 'artifacts', APP_ID, 'public', 'data', 'expenses', id)));
                }

                if (formData.splitMode === 'separate_pay' || formData.splitMode === 'fund_topup') {
                    // Multi-Payer: Generate multiple docs
                    // If Separate Pay: Each doc is a 'personal' expense
                    // If Topup: Each doc is a 'fund_topup' expense
                    // In both cases, the inputAmount stored in doc should be the PER PERSON amount.
                    formData.payers.forEach(payerId => {
                        const newDocRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'expenses')); 
                        let payload = { 
                            title: formData.title, currency: formData.currency, payer: payerId, 
                            involved: formData.splitMode === 'separate_pay' ? [payerId] : formData.involved, 
                            splitMode: formData.splitMode === 'separate_pay' ? 'personal' : 'fund_topup', 
                            customDetails: {},
                            date: formData.date, note: formData.note || '', 
                            inputAmount: finalInputPerRecord, // Store Per Person
                            amountTwd: finalTwdPerRecord,     // Store Per Person TWD
                            updatedAt: new Date().toISOString(),
                            createdAt: new Date().toISOString()
                        };
                        batch.set(newDocRef, payload);
                    });
                } else {
                    // Single Payer / Public Fund: Generate single doc
                    // Logic: The document represents the TOTAL transaction.
                    // So we store the TOTAL amount.
                    // This ensures balances are deducted by the total amount paid by the payer.
                    formData.payers.forEach(payerId => {
                        const newDocRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'expenses')); 
                        let docRef = (editingExpenseId && !editingGroupIds) ? doc(db, 'artifacts', APP_ID, 'public', 'data', 'expenses', editingExpenseId) : newDocRef;
                        
                        let payload = { 
                            title: formData.title, currency: formData.currency, payer: payerId, 
                            involved: formData.involved, splitMode: formData.splitMode, customDetails: formData.customDetails,
                            date: formData.date, note: formData.note || '', 
                            inputAmount: finalInputTotal, // Store TOTAL
                            amountTwd: finalTwdTotal,     // Store TOTAL TWD
                            updatedAt: new Date().toISOString()
                        };
                        if (!editingExpenseId && !editingGroupIds) payload.createdAt = new Date().toISOString();
                        
                        batch.set(docRef, payload);
                    });
                }

                try {
                    await batch.commit();
                    setFormData({ title: '', inputAmount: '', currency: 'TWD', payers: [PUBLIC_FUND_ID], involved: INITIAL_USERS.map(u=>u.id), splitMode: 'equal', customDetails: {}, date: new Date().toISOString().split('T')[0], amountType: 'per_person' });
                    setMemoizedTitle(''); 
                    setEditingExpenseId(null); setEditingGroupIds(null); setActiveTab('dashboard');
                    showToast('已記下！', 'success');
                } catch (e) { 
                    console.error(e);
                    showToast("儲存失敗", "error"); 
                } finally {
                    setIsSaving(false); 
                }
            };

            const handleExecuteDelete = async () => {
                if (!confirmDelete.expense || !fb) return;
                const { doc, writeBatch, db } = fb;
                try {
                    const batch = writeBatch(db);
                    if (confirmDelete.expense.isGroup) {
                        confirmDelete.expense.items.forEach(item => batch.delete(doc(db, 'artifacts', APP_ID, 'public', 'data', 'expenses', item.id)));
                    } else {
                        batch.delete(doc(db, 'artifacts', APP_ID, 'public', 'data', 'expenses', confirmDelete.expense.id));
                    }
                    await batch.commit();
                    showToast('已刪除', 'success');
                } catch(err) { showToast('刪除失敗'); } finally { setConfirmDelete({ show: false, expense: null }); }
            };

            const updateGasUrl = async (val) => {
                if (!fb) return;
                setSheetUrl(val);
                const { doc, setDoc, db } = fb;
                try { await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'appSettings', 'gasConfig'), { url: val }); } catch (e) {}
            };

             const syncToSheet = async () => {
                if(!sheetUrl) { setActiveTab('settings'); return; }
                setIsSyncing(true); setSyncStatus(null);
                const payload = {
                    expenses: expenses.map(e => ({ ...e, displayAmount: e.currency==='JPY'?`¥${e.inputAmount} (約$${e.amountTwd})`:`$${e.amountTwd}`, payerName: e.payer === PUBLIC_FUND_ID ? '公費' : users.find(u=>u.id===e.payer)?.name, involvedNames: e.splitMode==='fund_topup' ? '上繳公費' : e.splitMode==='custom' ? Object.entries(e.customDetails).map(([id,v])=>`${users.find(u=>u.id===id)?.name}($${v})`).join(', ') : e.splitMode==='personal' ? '自己付' : e.involved.map(id=>users.find(u=>u.id===id)?.name).join(', ') })),
                    debts, summary: users.map(u => ({ name: u.name, share: stats.totalShare[u.id]?.toFixed(0)||0 }))
                };
                try { await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); setTimeout(() => { setIsSyncing(false); setSyncStatus('success'); showToast('同步成功', 'success'); }, 1000); } catch (e) { setIsSyncing(false); setSyncStatus('error'); showToast('同步失敗'); }
            };

            const handleCustomAmountChange = (uid, val) => setFormData(p => ({...p, customDetails: {...p.customDetails, [uid]: val}}));

            const renderExpenseCard = (expense, isPersonal = false, isFundView = false, allowActions = true) => {
                let payerName = expense.payer === PUBLIC_FUND_ID ? '公費' : users.find(u=>u.id===expense.payer)?.name;
                
                const calculateMyShare = (item) => {
                    if (item.splitMode === 'personal') {
                        return (item.payer === viewingUserId) ? item.amountTwd : 0;
                    } else if (item.splitMode === 'custom') {
                        return parseFloat(item.customDetails[viewingUserId] || 0);
                    } else if (item.splitMode === 'fund_topup') {
                        return 0; 
                    } else if (item.involved.includes(viewingUserId)) {
                        return Math.round(item.amountTwd / item.involved.length);
                    }
                    return 0;
                };

                const calculateMyInputShare = (item) => {
                    const inputAmt = parseFloat(item.inputAmount || 0);
                    if (item.splitMode === 'personal') {
                        return (item.payer === viewingUserId) ? inputAmt : 0;
                    } else if (item.splitMode === 'custom') {
                        return 0; 
                    } else if (item.splitMode === 'fund_topup') {
                        return 0; 
                    } else if (item.involved.includes(viewingUserId)) {
                        return inputAmt / item.involved.length;
                    }
                    return 0;
                };

                let myShare = calculateMyShare(expense);
                let amountToShow = isPersonal ? myShare : expense.amountTwd;
                let inputAmountToShow = isPersonal ? calculateMyInputShare(expense) : expense.inputAmount;

                let isPurePrepay = isPersonal && (expense.payer === viewingUserId) && (expense.splitMode === 'fund_topup' || myShare === 0);
                
                if (isPurePrepay) {
                    amountToShow = expense.amountTwd;
                    inputAmountToShow = expense.inputAmount;
                }
                if (isPersonal && !isPurePrepay && myShare === 0 && expense.payer !== viewingUserId) return null; 

                const getTagStyle = (mode, payer) => {
                    if (mode === 'fund_topup') return 'bg-red-100 text-red-700'; // 上繳公費 (改為紅色)
                    if (payer === PUBLIC_FUND_ID) return 'bg-blue-100 text-blue-700'; // 公費付 (維持藍色)
                    if (mode === 'personal') return 'bg-amber-100 text-amber-800'; // 自己付 (改為琥珀色)
                    return 'bg-orange-100 text-orange-700'; // XXX先付 (維持淺橘色)
                };

                const getTagText = (mode, payerName) => {
                    if (mode === 'fund_topup') return '上繳公費';
                    if (payerName === '公費') return '公費付';
                    if (mode === 'personal') return '自己付';
                    return `${payerName}先付`;
                };
                
                let displayTotal = expense.totalGroupAmount;
                let displayInputTotal = expense.totalInputAmount;

                if (isPersonal && expense.isGroup) {
                     displayTotal = expense.items.reduce((sum, item) => sum + calculateMyShare(item), 0);
                     displayInputTotal = expense.items.reduce((sum, item) => sum + calculateMyInputShare(item), 0);
                } else if (isPersonal && !expense.isGroup) {
                     displayTotal = amountToShow;
                     displayInputTotal = inputAmountToShow;
                }
                
                if (!isPersonal) {
                     displayInputTotal = expense.isGroup ? expense.totalInputAmount : expense.inputAmount;
                }

                const ActionButtons = () => {
                    if (!allowActions) return null;
                    return (

                                e.preventDefault(); e.stopPropagation();
                                if (expense.isGroup) {
                                    const groupPayers = expense.items.map(i => i.payer);
                                    setFormData({ ...expense, payers: [...new Set(groupPayers)], inputAmount: expense.items[0].inputAmount, currency: expense.items[0].currency });
                                    setEditingGroupIds(expense.items.map(i => i.id)); setEditingExpenseId(null);
                                } else {
                                    setFormData({...expense, payers: [expense.payer]}); setEditingExpenseId(expense.id); setEditingGroupIds(null);
                                }
                                setActiveTab('add'); 
                            }} className="p-1.5 text-slate-400 hover:text-cyan-600"><Edit2 size={14}/></button>
                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setConfirmDelete({ show: true, expense: expense }); }} className="p-1.5 text-slate-400 hover:text-red-500"><Trash2 size={14}/></button>
                        </div>
                    );
                };

                if (expense.isGroup) {
                    return (
                        <div key={expense.id || expense.date + expense.title} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative mb-2 animate-fade-in">
                            <div className="flex justify-between items-start mb-2">
                                <div className="flex-1 pr-12">
                                    <h4 className="font-bold text-slate-800 text-lg">{expense.title}</h4>
                                    <p className="text-xs text-slate-400">{new Date(expense.date).toLocaleDateString()}</p>
                                </div>
                                <div className="text-right">
                                    <div className="font-bold text-slate-900 text-lg">{getDisplayAmount(displayTotal, displayInputTotal, expense.items[0].currency)}</div>
                                    <div className="flex justify-end mt-1"><ActionButtons /></div>
                                </div>
                            </div>
                            <div className="mt-3 space-y-2 border-t border-slate-50 pt-2">
                                {expense.items.map((item) => {
                                    const itemPayer = item.payer === PUBLIC_FUND_ID ? '公費' : users.find(u=>u.id===item.payer)?.name;
                                    const isFundTopUp = item.splitMode === 'fund_topup';
                                    
                                    let itemAmount = item.amountTwd;
                                    let itemInput = item.inputAmount;
                                    let itemIsPurePrepay = false;
                                    if (isPersonal) {
                                        let s = calculateMyShare(item);
                                        let si = calculateMyInputShare(item);
                                        itemIsPurePrepay = (item.payer === viewingUserId) && (isFundTopUp || s === 0);
                                        itemAmount = itemIsPurePrepay ? item.amountTwd : s;
                                        itemInput = itemIsPurePrepay ? item.inputAmount : si;
                                    } else {
                                        itemIsPurePrepay = (item.splitMode === 'personal' && !item.involved.includes(item.payer)) || isFundTopUp;
                                    }

                                    const showGray = isFundTopUp || itemIsPurePrepay;
                                    const itemDisplayAmount = getDisplayAmount(itemAmount, itemInput, item.currency);
                                    
                                    let listTagStyle = getTagStyle(item.splitMode, item.payer);
                                    let listTagText = getTagText(item.splitMode, itemPayer);

                                    return (
                                        <div key={item.id} className="flex justify-between items-center text-sm">
                                            <div className="flex items-center gap-2">
                                                <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${listTagStyle}`}>{listTagText}</span>
                                                <span className="text-slate-600">{itemPayer}</span>
                                            </div>
                                            <span className={`font-mono ${showGray ? 'text-gray-400' : 'text-slate-700'}`}>{showGray ? `(${itemDisplayAmount})` : itemDisplayAmount}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    );
                }

                let finalDisplayStr = "";
                if (isPersonal && !isPurePrepay && expense.splitMode !== 'personal') {
                     finalDisplayStr = getDisplayAmount(amountToShow, inputAmountToShow, expense.currency);
                } else {
                     finalDisplayStr = getDisplayAmount(amountToShow, expense.inputAmount, expense.currency);
                }

                return (
                    <div key={expense.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative mb-2 animate-fade-in">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex-1 pr-12">
                                <div className="flex items-center gap-2 flex-wrap mb-1">
                                    <h4 className="font-bold text-slate-800">{expense.title}</h4>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${getTagStyle(expense.splitMode, expense.payer)}`}>{getTagText(expense.splitMode, payerName)}</span>
                                </div>
                                <p className="text-xs text-slate-400">{new Date(expense.date).toLocaleDateString()}</p>
                            </div>
                            <div className="text-right">
                                <div className={`font-bold flex flex-col items-end gap-0.5 ${isPurePrepay ? 'text-gray-400' : 'text-slate-900'}`}>
                                    <div className="flex items-center gap-1">{isPurePrepay && '('}{finalDisplayStr}{isPurePrepay && ')'}</div>
                                    {isPurePrepay && <p className="text-[10px] text-gray-400 font-medium">不計入消費</p>}
                                </div>
                            </div>
                        </div>
                        <div className="flex justify-between items-end">
                            <div className="text-xs text-slate-500 mt-1 flex-1 mr-4">
                                {expense.splitMode === 'fund_topup' ? `${payerName} 儲值進公費` : expense.splitMode === 'personal' ? `${payerName} 自己付` : `由 ${expense.involved.map(id=>users.find(u=>u.id===id)?.name).join('、')} 平分`}
                            </div>
                            <ActionButtons />
                        </div>
                        {expense.note && <div className="mt-2 text-xs text-slate-400 bg-slate-50 p-2 rounded">📝 {expense.note}</div>}
                    </div>
                );
            };

            const TabButton = ({ id, label, icon: Icon }) => (
                <button onClick={() => setActiveTab(id)} className={`flex flex-col items-center justify-center py-3 px-1 flex-1 transition-colors ${activeTab === id ? 'text-cyan-600 border-t-2 border-cyan-600 bg-cyan-50' : 'text-slate-400 hover:text-cyan-500'}`}>
                    <Icon size={20} className="mb-1" /><span className="text-xs font-medium">{label}</span>
                </button>
            );

            // --- Helper: Get Calculation Text for UI ---
            const getCalculationText = () => {
                if (!formData.inputAmount) return null;
                const amt = parseFloat(formData.inputAmount);
                const currency = formData.currency === 'JPY' ? '¥' : '$';
                
                // Common styling for info boxes
                const InfoBox = ({ mainLabel, mainValue, subLabel, subValue, theme = 'default' }) => {
                    const themes = {
                        default: 'bg-slate-50 border-slate-100 text-slate-700', // Default
                        amber: 'bg-amber-50 border-amber-100 text-amber-900',
                        blue: 'bg-blue-50 border-blue-100 text-blue-900', 
                    };
                    return (
                        <div className={`${themes[theme]} border rounded-lg p-3 flex justify-between items-center w-full shadow-sm`}>
                            <div className="flex flex-col items-start">
                                <span className={`text-[10px] font-bold uppercase tracking-wide opacity-60 mb-0.5`}>{mainLabel}</span>
                                <span className="text-xl font-bold">{mainValue}</span>
                            </div>
                            {subLabel && (
                                <div className="text-right flex flex-col items-end">
                                    <span className="text-[10px] opacity-50 block mb-0.5">{subLabel}</span>
                                    <span className="text-sm font-medium opacity-80">{subValue}</span>
                                </div>
                            )}
                        </div>
                    );
                };

                // Case 1: Multi-Payer
                if (isMultiPayer) {
                    const count = formData.payers.length;
                    if (formData.amountType === 'per_person') {
                        return <InfoBox theme="amber" mainLabel="每人支付" mainValue={`${currency}${amt.toLocaleString()}`} subLabel="總共收到" subValue={`${currency}${(amt*count).toLocaleString()}`} />;
                    } else {
                        return <InfoBox theme="amber" mainLabel="總共收到" mainValue={`${currency}${amt.toLocaleString()}`} subLabel="每人支付" subValue={`${currency}${(amt/count).toLocaleString(undefined, {maximumFractionDigits: 1})}`} />;
                    }
                }
                
                // Case 2: Public Fund Payer
                if (isFundPayer) {
                    const count = 5; // Fixed 5 users
                    if (formData.amountType === 'per_person') {
                        return <InfoBox theme="blue" mainLabel="每人消費" mainValue={`${currency}${amt.toLocaleString()}`} subLabel="公費總扣" subValue={`${currency}${(amt*count).toLocaleString()}`} />;
                    } else {
                        return <InfoBox theme="blue" mainLabel="公費總扣" mainValue={`${currency}${amt.toLocaleString()}`} subLabel="每人消費" subValue={`${currency}${(amt/count).toLocaleString(undefined, {maximumFractionDigits: 1})}`} />;
                    }
                }

                // Case 3: Single Payer (Helping others / Equal Split)
                if (formData.splitMode === 'equal') {
                    const count = formData.involved.length;
                    if (formData.amountType === 'per_person') {
                        return <InfoBox theme="default" mainLabel="每人欠你" mainValue={`${currency}${amt.toLocaleString()}`} subLabel="你先付總額" subValue={`${currency}${(amt*count).toLocaleString()}`} />;
                    } else {
                        return <InfoBox theme="default" mainLabel="你先付總額" mainValue={`${currency}${amt.toLocaleString()}`} subLabel="每人欠你" subValue={`${currency}${(amt/count).toLocaleString(undefined, {maximumFractionDigits: 1})}`} />;
                    }
                }

                // Default (Personal / Custom)
                return <InfoBox mainLabel="金額" mainValue={`${currency}${amt.toLocaleString()}`} />;
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col pb-[calc(env(safe-area-inset-bottom)+80px)]">
                    {toast.show && <div className={`fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-[300] text-white font-bold text-sm animate-slide-down flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-500' : 'bg-slate-800'}`}>{toast.type === 'error' && <Alert size={16} />}{toast.msg}</div>}
                    
                    {confirmDelete.show && (
                        <div className="fixed inset-0 z-[500] flex items-center justify-center p-6 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white w-full max-w-xs rounded-2xl p-6 shadow-2xl">
                                <h3 className="text-lg font-bold text-slate-800 mb-2">確定要刪除嗎？</h3>
                                <p className="text-sm text-slate-500 mb-6">此動作無法復原，請確認帳目正確。</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDelete({ show: false, expense: null })} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold text-sm">取消</button>
                                    <button onClick={handleExecuteDelete} className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold text-sm">確定刪除</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="fixed top-0 w-full max-w-md left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-sm shadow-sm px-6 py-4 z-[150] flex justify-between items-center border-b border-cyan-100">
                        <div><h1 className="text-xl font-bold text-cyan-700">平凡去沖繩 🌊</h1><p className="text-xs text-slate-400 font-bold uppercase tracking-tight">四年啦四年！？明年就五年啦！</p></div>
                        <button onClick={() => setDisplayCurrency(prev => prev === 'TWD' ? 'JPY' : 'TWD')} className="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm transition-all bg-cyan-500 text-white hover:bg-cyan-600">
                            <ArrowLeftRight size={12} />顯示: {displayCurrency}
                        </button>
                    </header>

                    <div className="h-[76px]"></div>

                    <main className="max-w-md mx-auto p-4 space-y-5 flex-1 w-full">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white rounded-2xl shadow-sm border border-cyan-200 overflow-hidden animate-fade-in">
                                    <button onClick={() => setIsFundDetailsOpen(!isFundDetailsOpen)} className="w-full px-5 py-4 bg-cyan-50 flex justify-between items-center transition-colors border-b border-cyan-50">
                                        <div className="flex flex-col items-start text-left">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">公費餘額</p>
                                            <p className="text-xl font-bold font-mono text-cyan-900">{formatPublicFundJPY(stats.publicFundJpy, stats.publicFundTwd)}</p>
                                        </div>
                                        <div className="text-cyan-600">{isFundDetailsOpen ? <ChevronUp size={20}/> : <ChevronDown size={20}/>}</div>
                                    </button>
                                    {isFundDetailsOpen && (
                                        <div className="p-4 space-y-1 bg-white border-t border-cyan-100">
                                            {publicFundExpenses.length === 0 ? <div className="text-center py-4 text-slate-400 text-xs italic">尚無公費紀錄</div> : publicFundExpenses.map(e => renderExpenseCard(e, false, true, false))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white p-4 rounded-2xl border border-cyan-100 shadow-sm">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 block mb-2">你是誰？</label>
                                    <select value={viewingUserId} onChange={(e) => { setViewingUserId(e.target.value); setIsPersonalOpen(true); }} className="custom-select w-full bg-slate-50 border border-slate-200 text-slate-600 text-base rounded-xl p-3 appearance-none outline-none">
                                        <option value="" disabled>請選擇</option>
                                        {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                    </select>
                                </div>

                                {viewingUserId && (
                                    <div className="bg-white rounded-2xl shadow-md border border-cyan-200 overflow-hidden animate-fade-in">
                                        <button onClick={() => setIsPersonalOpen(!isPersonalOpen)} className="w-full px-5 py-4 bg-cyan-50 flex justify-between items-center">
                                            <div className="flex flex-col items-start text-left">
                                                <h3 className="font-bold text-cyan-800 flex items-center gap-2"><PieChart size={16} className="text-cyan-600" />{users.find(u=>u.id===viewingUserId)?.name}的帳本</h3>
                                                <span className="text-xs text-cyan-600">消費價值：<span className="font-bold text-lg">{formatMoney(stats.totalShare[viewingUserId]||0)}</span></span>
                                            </div>
                                            {isPersonalOpen ? <ChevronUp size={20} className="text-cyan-600" /> : <ChevronDown size={20} className="text-cyan-600" />}
                                        </button>
                                        {isPersonalOpen && <div className="p-4 space-y-1 bg-white border-t border-cyan-100">{myExpenses.length === 0 ? <div className="text-center text-slate-400 py-4 text-xs italic">目前無相關帳目</div> : myExpenses.map(e => renderExpenseCard(e, true, false, false))}</div>}
                                    </div>
                                )}

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <button onClick={() => setIsGeneralOpen(!isGeneralOpen)} className="w-full px-5 py-4 bg-slate-50/50 flex justify-between items-center">
                                        <div className="flex items-center gap-2 text-slate-700 font-bold"><LayoutDashboard size={16} />總帳本</div>
                                        {isGeneralOpen ? <ChevronUp size={16} className="text-slate-400" /> : <ChevronDown size={16} className="text-slate-400" />}
                                    </button>
                                    {isGeneralOpen && <div className="p-4 space-y-1 bg-white border-t border-slate-100">{groupedExpenses.length === 0 ? <div className="text-center py-4 text-slate-400 text-xs italic">還沒有紀錄 🍃</div> : groupedExpenses.map(e => renderExpenseCard(e, false))}</div>}
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <button onClick={() => setIsDebtsOpen(!isDebtsOpen)} className="w-full px-5 py-4 bg-slate-50/50 flex justify-between items-center">
                                        <div className="flex items-center gap-2 text-slate-700 font-bold"><RefreshCw size={16} />結算建議</div>
                                        {isDebtsOpen ? <ChevronUp size={16} className="text-slate-400" /> : <ChevronDown size={16} className="text-slate-400" />}
                                    </button>
                                    {isDebtsOpen && (
                                        <div className="p-5 space-y-3 bg-white border-t border-cyan-50">
                                            <div className="bg-blue-50 border border-blue-100 p-3 rounded-lg text-sm text-blue-800">
                                                <strong className="block mb-1 font-bold">💡 第一步：公費處理</strong>
                                                {stats.publicFundBalance > 0 ? `公費剩餘 ${formatPublicFundJPY(stats.publicFundJpy, stats.publicFundTwd)}。請平分退還每人 ${formatMoney(stats.publicFundBalance/5)}。` : stats.publicFundBalance < 0 ? `公費透支 ${formatPublicFundJPY(stats.publicFundJpy, stats.publicFundTwd)}。請每人拿出 ${formatMoney(Math.abs(stats.publicFundBalance)/5)} 補齊。` : "公費剛好完畢。"}
                                            </div>
                                            {debts.length === 0 ? <div className="text-center py-4 text-slate-400 text-sm">無欠款 ✨</div> : debts.map((d, i) => <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm"><div className="flex items-center gap-2"><span>{d.from}</span><ArrowRight size={12} className="text-slate-400" /><span>{d.to}</span></div><span className="font-bold text-cyan-600">{formatMoney(d.amount)}</span></div>)}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'add' && (
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-cyan-100 animate-fade-in-up">
                                <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">{editingExpenseId ? <Edit2 size={24} className="text-cyan-500" /> : <Plus size={24} className="text-cyan-500" />}{editingExpenseId ? '修改支出' : '新增支出'}</h2>
                                <div className="space-y-5">
                                    <div><label className="block text-sm font-medium text-slate-500 mb-1">日期</label><input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="input-standard p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" /></div>
                                    <div><label className="block text-sm font-medium text-slate-500 mb-1">項目</label><input type="text" value={formData.title} onChange={e => {setFormData({...formData, title: e.target.value}); setMemoizedTitle(e.target.value);}} className="input-standard p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" placeholder="輸入項目名稱" disabled={formData.splitMode === 'fund_topup'} /></div>
                                    <div>
                                        {/* Amount Type Toggle (Universally Available) */}
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-sm font-medium text-slate-500">金額</label>
                                            <div className="flex bg-slate-100 rounded-lg p-0.5">
                                                <button onClick={() => setFormData(p => ({...p, amountType: 'per_person'}))} className={`px-2 py-0.5 text-[10px] font-bold rounded-md transition-all ${formData.amountType === 'per_person' ? 'bg-white text-cyan-600 shadow-sm' : 'text-slate-400'}`}>每人</button>
                                                <button onClick={() => setFormData(p => ({...p, amountType: 'total'}))} className={`px-2 py-0.5 text-[10px] font-bold rounded-md transition-all ${formData.amountType === 'total' ? 'bg-white text-cyan-600 shadow-sm' : 'text-slate-400'}`}>總額</button>
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <div className="relative flex-1">
                                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold">{formData.currency === 'JPY' ? '¥' : '$'}</span>
                                                <input type="number" value={formData.inputAmount} onChange={e => setFormData({...formData, inputAmount: e.target.value})} placeholder="0" className="w-full pl-8 p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-lg outline-none" />
                                            </div>
                                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                                <button onClick={() => setFormData({...formData, currency: 'TWD'})} className={`px-3 text-xs font-bold rounded-lg transition-all ${formData.currency === 'TWD' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>TWD</button>
                                                <button onClick={() => setFormData({...formData, currency: 'JPY'})} className={`px-3 text-xs font-bold rounded-lg transition-all ${formData.currency === 'JPY' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>JPY</button>
                                            </div>
                                        </div>
                                        {/* Helper Text for approx calculation */}
                                        {formData.currency === 'JPY' && formData.inputAmount && <p className="text-xs text-slate-400 mt-1 text-right">≈ TWD ${Math.round((formData.amountType === 'total' && (isMultiPayer || isFundPayer || (!isMultiPayer && formData.splitMode==='equal')) ? parseFloat(formData.inputAmount) / (isMultiPayer ? formData.payers.length : (isFundPayer ? 5 : formData.involved.length)) : parseFloat(formData.inputAmount)) * exchangeRate).toLocaleString()} / 人</p>}
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-500 mb-2">誰付錢？</label>
                                        
                                        {/* OPTIMIZED BUTTON LAYOUT: 2 rows of 3 cols (grid-cols-3) */}
                                        <div className="grid grid-cols-3 gap-2 w-full">
                                            <button onClick={() => togglePayer(PUBLIC_FUND_ID)} className={`col-span-1 py-3 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-1 ${formData.payers.includes(PUBLIC_FUND_ID) ? 'bg-blue-500 text-white shadow-md transform scale-[1.02]' : 'bg-blue-50 text-blue-600 hover:bg-blue-100'}`}>
                                                <Wallet size={14}/>公費
                                            </button>
                                            {users.map(u => (
                                                <button key={u.id} onClick={() => togglePayer(u.id)} className={`col-span-1 py-3 rounded-xl text-sm transition-all font-medium ${formData.payers.includes(u.id) ? 'bg-cyan-500 text-white shadow-md transform scale-[1.02]' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                                    {u.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {/* Info Box & Mode Buttons - Cleaned up spacing */}
                                    <div className="w-full space-y-3 mt-1">
                                        <div className="w-full">
                                            {getCalculationText()}
                                        </div>
                                        
                                        {isMultiPayer ? (
                                            <div className="flex gap-2">
                                                <button onClick={() => toggleSplitMode('separate_pay')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${formData.splitMode === 'separate_pay' ? 'bg-amber-100 text-amber-700 shadow-sm border border-amber-200' : 'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>各自付</button>
                                                <button onClick={() => toggleSplitMode('fund_topup')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${formData.splitMode === 'fund_topup' ? 'bg-red-100 text-red-700 shadow-sm border border-red-200' : 'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>上繳公費</button>
                                            </div>
                                        ) : (
                                            <>
                                                {isFundPayer ? (
                                                    // No extra buttons needed for Fund Payer, InfoBox is enough
                                                    null
                                                ) : (
                                                    <div className="w-full">
                                                        <div className="flex gap-2 mb-2 px-1">
                                                            <button onClick={() => setFormData({...formData, splitMode: 'equal', title: memoizedTitle})} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${formData.splitMode === 'equal' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>
                                                                平分
                                                            </button>
                                                            <button onClick={() => setFormData({...formData, splitMode: 'personal', title: memoizedTitle})} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${formData.splitMode === 'personal' ? 'bg-amber-100 text-amber-600 shadow' : 'text-slate-400'}`}>自己付</button>
                                                            <button onClick={() => setFormData(prev => ({...prev, splitMode: 'fund_topup', title: '上繳公費'}))} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${formData.splitMode === 'fund_topup' ? 'bg-red-100 text-red-600 shadow' : 'text-slate-400'}`}>上繳公費</button>
                                                        </div>
                                                        
                                                        {/* Equal Split Mode (Single Payer) - 1 Row Grid, Removed outer gray box */}
                                                        {formData.splitMode === 'equal' && (
                                                            <div className="mt-1 px-1">
                                                                <div className="grid grid-cols-5 gap-1 w-full">
                                                                     {users.map(u => (
                                                                        <button key={u.id} onClick={() => toggleInvolved(u.id)} className={`col-span-1 py-2 rounded-lg text-xs border transition-all flex items-center justify-center ${formData.involved.includes(u.id) ? 'border-cyan-400 bg-cyan-50 text-cyan-700 font-bold' : 'border-slate-200 bg-transparent text-slate-400'} ${isFundPayer ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                                                            {u.name}
                                                                        </button>
                                                                     ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </>
                                        )}
                                    </div>
                                    
                                    <div><label className="block text-sm font-medium text-slate-500 mb-1">備註</label><input type="text" value={formData.note || ''} onChange={e => setFormData({...formData, note: e.target.value})} className="input-standard p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" placeholder="" /></div>
                                    <div className="pt-4"><button onClick={saveExpense} disabled={isSaving} className={`w-full py-4 bg-cyan-500 text-white rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2 ${isSaving ? 'opacity-70 cursor-wait' : ''}`}><Save size={20} />{editingExpenseId ? '儲存修改' : (isSaving ? '處理中...' : '記下來')}</button></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-6 animate-fade-in shrink-0">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-cyan-100"><h3 className="font-bold text-cyan-800 mb-3 flex items-center gap-2"><Globe size={16} />匯率 (JPY → TWD)</h3><div className="flex items-center gap-4 bg-slate-50 p-4 rounded-xl text-sm"><span>1 日幣 =</span><input type="number" step="0.001" value={exchangeRate} onChange={e => setExchangeRate(e.target.value)} className="w-20 p-2 text-center font-bold text-slate-800 border border-slate-200 rounded-lg outline-none" /><span>台幣</span></div></div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 opacity-90 text-left">
                                    <div className="flex flex-col gap-3">
                                        <h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm"><FileSpreadsheet className="w-4 h-4 text-slate-400" />Google Sheet 連動</h3>
                                        <div className="flex gap-2">
                                            <input type="text" value={sheetUrl} onChange={e => updateGasUrl(e.target.value)} placeholder="貼上 GAS 網址" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono outline-none" />
                                            <button onClick={syncToSheet} disabled={isSyncing} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-all whitespace-nowrap ${syncStatus === 'success' ? 'bg-green-100 text-green-700' : syncStatus === 'error' ? 'bg-red-100 text-red-700' : 'bg-cyan-500 text-white hover:bg-cyan-600'}`}>
                                                {isSyncing ? <RefreshCw className="animate-spin w-3 h-3" /> : syncStatus === 'success' ? <CheckCircle className="w-3 h-3" /> : <FileSpreadsheet className="w-3 h-3" />}{isSyncing ? '中' : '同步'}
                                            </button>
                                        </div>
                                        <div className="text-left mt-1">
                                            <a href="https://docs.google.com/spreadsheets/d/19nQPjoqHKST3qQothDmyoKM01EDIAPiCUeFHmUkV21E/edit?gid=2086443444#gid=2086443444" target="_blank" className="text-slate-900 text-sm font-bold underline underline-offset-4 decoration-cyan-400">沖繩平安喔 🚗 🚗 🚗</a>
                                        </div>
                                    </div>
                                </div>
                                <div className="text-center text-[10px] text-slate-300 pb-8 uppercase tracking-widest">v7.6 - Color Swap</div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 flex justify-between z-[100] pb-[env(safe-area-inset-bottom)] shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                        <TabButton id="dashboard" label="儀表板" icon={LayoutDashboard} />
                        <div className="relative -top-5 flex justify-center">
                            <button onClick={() => { setEditingExpenseId(null); setActiveTab('add'); }} className="bg-cyan-500 text-white p-4 rounded-full shadow-xl hover:bg-cyan-600 transition-all border-4 border-slate-50 active:scale-90"><Plus size={28} /></button>
                        </div>
                        <TabButton id="settings" label="設定" icon={Settings} />
                    </nav>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
