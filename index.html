<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>平凡去沖繩</title>
    
    <!-- 1. 引入程式庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script>
        window.react = window.React;
        window['react-dom'] = window.ReactDOM;
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }
        
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .input-standard { width: 100% !important; display: block; appearance: none; -webkit-appearance: none; box-sizing: border-box; }
        
        .custom-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            padding-right: 2.5rem;
        }

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #f8fafc; color: #64748b; z-index: 1000; flex-direction: column; text-align: center; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="loading-screen">
        <p class="text-xl font-bold mb-2">正在載入沖繩之旅...🌊</p>
        <p class="text-xs">四年啦四年！？</p>
    </div>

    <script type="text/babel">
        const removeLoading = () => {
            const el = document.getElementById('loading-screen');
            if(el) el.style.display = 'none';
        };

        const firebaseConfig = {
            apiKey: "AIzaSyA5MRIK9yxJ_XNRIfgnLdXjRBoLFQWr8o0",
            authDomain: "okinawa-financial-sheet.firebaseapp.com",
            projectId: "okinawa-financial-sheet",
            storageBucket: "okinawa-financial-sheet.firebasestorage.app",
            messagingSenderId: "1032242385806",
            appId: "1:1032242385806:web:7fa5753a22d4e45f934adf",
            measurementId: "G-33EEBGS9F3"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useMemo } = React;

        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Plus: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>,
            Trash2: (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>,
            Users: (p) => <IconBase {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            LayoutDashboard: (p) => <IconBase {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconBase>,
            Edit2: (p) => <IconBase {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>,
            Settings: (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            Globe: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"/></IconBase>,
            RefreshCw: (p) => <IconBase {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>,
            CheckCircle: (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            FileSpreadsheet: (p) => <IconBase {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></IconBase>,
            HelpCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></IconBase>,
            X: (p) => <IconBase {...p}><path d="M18 6 6 18"/><path d="M6 6 18 18"/></IconBase>,
            PieChart: (p) => <IconBase {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>,
            ArrowRight: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></IconBase>,
            ChevronDown: (p) => <IconBase {...p}><path d="m6 9 6 6 6-6"/></IconBase>,
            ChevronUp: (p) => <IconBase {...p}><path d="m18 15-6-6-6 6"/></IconBase>,
            Save: (p) => <IconBase {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            User: (p) => <IconBase {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>,
            Alert: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>,
            Wallet: (p) => <IconBase {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></IconBase>
        };
        const { Plus, Trash2, Users, LayoutDashboard, Edit2, Settings, Globe, RefreshCw, CheckCircle, FileSpreadsheet, HelpCircle, X, PieChart, ArrowRight, ChevronDown, ChevronUp, Save, User, Alert, Wallet } = Icons;

        const INITIAL_USERS = [ { id: '1', name: '陳浚愷' }, { id: '2', name: '許瀅珊' }, { id: '3', name: '黃韻庭' }, { id: '4', name: '楊予瑄' }, { id: '5', name: '侯宇薪' } ];
        const PUBLIC_FUND_ID = 'public_fund'; 

        function App() {
            const [users, setUsers] = useState(INITIAL_USERS);
            const [expenses, setExpenses] = useState([]); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currentUser, setCurrentUser] = useState(null);
            const [viewingUserId, setViewingUserId] = useState(''); 
            const [exchangeRate, setExchangeRate] = useState(0.22);
            
            const [isGeneralOpen, setIsGeneralOpen] = useState(false);
            const [isPersonalOpen, setIsPersonalOpen] = useState(false); 
            const [isDebtsOpen, setIsDebtsOpen] = useState(false);
            const [isFundDetailsOpen, setIsFundDetailsOpen] = useState(false);
            
            const [editingExpenseId, setEditingExpenseId] = useState(null);
            const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });
            
            // 自定義刪除確認視窗 State
            const [confirmDelete, setConfirmDelete] = useState({ show: false, expense: null });

            const [formData, setFormData] = useState({
                title: '', inputAmount: '', currency: 'TWD', payers: [INITIAL_USERS[0].id], involved: INITIAL_USERS.map(u=>u.id), splitMode: 'equal', customDetails: {}, date: new Date().toISOString().split('T')[0], amountType: 'total'
            });
            const [sheetUrl, setSheetUrl] = useState(''); 
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState(null); 

            const showToast = (msg, type = 'error') => {
                setToast({ show: true, msg, type });
                setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3000);
            };

            useEffect(() => {
                removeLoading();
                auth.signInAnonymously().catch(console.error);
                return auth.onAuthStateChanged(setCurrentUser);
            }, []);

            useEffect(() => {
                if (!currentUser) return;
                const unsubExpenses = db.collection('expenses')
                    .onSnapshot((snapshot) => {
                        let newExpenses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        newExpenses.sort((a, b) => {
                            const dateA = a.date || ''; const dateB = b.date || '';
                            if (dateB !== dateA) return dateB.localeCompare(dateA);
                            return (b.createdAt || '').localeCompare(a.createdAt || '');
                        });
                        setExpenses(newExpenses);
                    }, (err) => showToast("資料庫連線失敗"));
                const unsubSettings = db.collection('appSettings').doc('gasConfig')
                    .onSnapshot((doc) => { if (doc.exists) { setSheetUrl(doc.data().url || ''); } });
                return () => { unsubExpenses(); unsubSettings(); };
            }, [currentUser]);

            useEffect(() => {
                const fetchRate = async () => {
                    try {
                        const res = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                        const data = await res.json();
                        if (data?.rates?.TWD) setExchangeRate(data.rates.TWD);
                    } catch (e) { console.error(e); }
                };
                fetchRate();
            }, []);

            useEffect(() => {
                if (activeTab === 'add') {
                    if (formData.splitMode === 'fund_topup') {
                        setFormData(prev => ({ ...prev, title: '上繳公費' }));
                    } else if (formData.title === '上繳公費') {
                        setFormData(prev => ({ ...prev, title: '' }));
                    }
                }
            }, [formData.splitMode, activeTab]);

            const stats = useMemo(() => {
                const bal = {}; const share = {};
                users.forEach(u => { bal[u.id] = 0; share[u.id] = 0; });
                bal[PUBLIC_FUND_ID] = 0; 

                expenses.forEach(exp => {
                    const paidBy = exp.payer; 
                    const amountTwd = parseFloat(exp.amountTwd || 0);

                    if (bal[paidBy] !== undefined) bal[paidBy] += amountTwd;
                    
                    if (exp.splitMode === 'fund_topup') {
                        bal[PUBLIC_FUND_ID] -= amountTwd;
                    } else if (exp.splitMode === 'personal') {
                        if (share[paidBy] !== undefined) { share[paidBy] += amountTwd; bal[paidBy] -= amountTwd; }
                    } else if (exp.splitMode === 'custom' && exp.customDetails) {
                        Object.entries(exp.customDetails).forEach(([uid, val]) => {
                            const s = parseFloat(val);
                            if (share[uid] !== undefined) { share[uid] += s; bal[uid] -= s; }
                        });
                    } else {
                        const count = exp.involved.length; 
                        const split = amountTwd / count;
                        exp.involved.forEach(uid => { 
                            if (share[uid] !== undefined) { 
                                share[uid] += split; 
                                bal[uid] -= split; 
                            } 
                        });
                    }
                });
                return { balances: bal, totalShare: share, publicFundBalance: -(bal[PUBLIC_FUND_ID] || 0) };
            }, [users, expenses]);

            const debts = useMemo(() => {
                let debtors = []; let creditors = [];
                const pfBalance = stats.balances[PUBLIC_FUND_ID] || 0;
                const splitPf = pfBalance / users.length; 

                const adjustedBalances = { ...stats.balances };
                delete adjustedBalances[PUBLIC_FUND_ID]; 

                users.forEach(u => {
                    adjustedBalances[u.id] += splitPf;
                });

                Object.entries(adjustedBalances).forEach(([id, amt]) => {
                    const r = Math.round(amt);
                    if (r < -1) debtors.push({ id, amount: r });
                    if (r > 1) creditors.push({ id, amount: r });
                });
                debtors.sort((a,b) => a.amount - b.amount); creditors.sort((a,b) => b.amount - a.amount);
                
                const txs = []; let i=0; let j=0;
                while(i < debtors.length && j < creditors.length) {
                    const d = debtors[i]; const c = creditors[j];
                    const amt = Math.min(Math.abs(d.amount), c.amount);
                    if (amt > 0) txs.push({ from: users.find(u=>u.id===d.id)?.name, to: users.find(u=>u.id===c.id)?.name, amount: amt.toFixed(0) });
                    d.amount += amt; c.amount -= amt;
                    if (Math.abs(d.amount) < 1) i++; if (c.amount < 1) j++;
                }
                return txs;
            }, [stats.balances, users]);

            const myExpenses = useMemo(() => {
                if (!viewingUserId) return [];
                return expenses.filter(e => {
                    return e.payer === viewingUserId || e.involved.includes(viewingUserId);
                });
            }, [expenses, viewingUserId]);

            const publicFundExpenses = useMemo(() => {
                return expenses.filter(e => e.payer === PUBLIC_FUND_ID || e.splitMode === 'fund_topup');
            }, [expenses]);

            const getGroupedExpenses = (list) => {
                const grouped = [];
                let currentGroup = null;

                list.forEach(item => {
                    if (currentGroup) {
                        const isSame = 
                            item.date === currentGroup.date &&
                            item.title === currentGroup.title &&
                            item.inputAmount === currentGroup.inputAmount &&
                            item.currency === currentGroup.currency &&
                            item.splitMode === currentGroup.splitMode &&
                            (item.splitMode === 'fund_topup' || item.splitMode === 'personal');
                        
                        if (isSame) {
                            currentGroup.items.push(item);
                            currentGroup.totalTwd += item.amountTwd;
                            return;
                        } else {
                            grouped.push(currentGroup);
                        }
                    }

                    currentGroup = {
                        ...item,
                        items: [item],
                        totalTwd: item.amountTwd,
                        isGroup: false
                    };
                });
                
                if (currentGroup) grouped.push(currentGroup);

                return grouped.map(g => {
                    if (g.items.length > 1) {
                        g.isGroup = true;
                        const names = g.items.map(i => i.payer === PUBLIC_FUND_ID ? '公費' : users.find(u=>u.id===i.payer)?.name).join('、');
                        g.groupNames = names;
                    }
                    return g;
                });
            };

            const togglePayer = (uid) => {
                const currentPayers = formData.payers || [];
                if (uid === PUBLIC_FUND_ID) {
                    let newSplitMode = formData.splitMode;
                    if (newSplitMode === 'fund_topup' || newSplitMode === 'personal') {
                        newSplitMode = 'equal';
                    }
                    setFormData(prev => ({...prev, payers: [PUBLIC_FUND_ID], splitMode: newSplitMode, title: ''})); 
                    return;
                }

                let newPayers = currentPayers.includes(PUBLIC_FUND_ID) ? [] : [...currentPayers];

                if (newPayers.includes(uid)) {
                    if (newPayers.length > 1) {
                        newPayers = newPayers.filter(id => id !== uid);
                    }
                } else {
                    newPayers.push(uid);
                }
                
                let newSplitMode = formData.splitMode;
                if (newPayers.length > 1) {
                    if (newSplitMode === 'personal' || newSplitMode === 'custom') {
                        newSplitMode = 'equal';
                    }
                }

                setFormData(prev => ({...prev, payers: newPayers, splitMode: newSplitMode}));
            };

            const saveExpense = async () => {
                if (!formData.title) { showToast('請輸入項目'); return; }
                if (!formData.inputAmount) { showToast('請輸入金額'); return; }
                if (!formData.payers || formData.payers.length === 0) { showToast('請先確認付款人'); return; }
                
                const inputVal = parseFloat(formData.inputAmount);
                const finalTwd = formData.currency === 'JPY' ? Math.round(inputVal * exchangeRate) : inputVal;
                
                const batch = db.batch();
                const payers = formData.payers;
                const isMultiPayer = payers.length > 1;

                let amountPerRecord = finalTwd;
                let inputAmountPerRecord = inputVal;

                if (isMultiPayer && formData.amountType === 'total') {
                    amountPerRecord = Math.round(finalTwd / payers.length);
                    inputAmountPerRecord = inputVal / payers.length; 
                }

                payers.forEach(payerId => {
                    const newDocRef = db.collection('expenses').doc(); 
                    let currentDocRef;
                    let isUpdate = false;
                    if (editingExpenseId) {
                         currentDocRef = db.collection('expenses').doc(editingExpenseId);
                         isUpdate = true;
                    } else {
                         currentDocRef = newDocRef;
                    }
                    let dataPayload = { 
                        title: formData.title,
                        currency: formData.currency,
                        payer: payerId, 
                        involved: formData.involved,
                        splitMode: formData.splitMode,
                        customDetails: formData.customDetails,
                        date: formData.date,
                        note: formData.note || '', 
                        inputAmount: isMultiPayer && !isUpdate ? inputAmountPerRecord : inputVal, 
                        amountTwd: isMultiPayer && !isUpdate ? amountPerRecord : finalTwd,
                        updatedAt: new Date().toISOString()
                    };
                    if (!isUpdate) { dataPayload.createdAt = new Date().toISOString(); }
                    if (formData.splitMode === 'personal') {
                        dataPayload.involved = [payerId];
                    } else if (formData.splitMode === 'equal' && isMultiPayer) {
                        dataPayload.splitMode = 'personal'; 
                        dataPayload.involved = [payerId];
                    } else if (formData.splitMode === 'custom') {
                        if (formData.currency === 'JPY') {
                            const converted = {};
                            Object.entries(formData.customDetails).forEach(([id, val]) => converted[id] = Math.round(parseFloat(val) * exchangeRate));
                            dataPayload.customDetails = converted;
                        }
                    } 
                    if (isUpdate) { batch.update(currentDocRef, dataPayload); } else { batch.set(currentDocRef, dataPayload); }
                });

                if (editingExpenseId && payers.length > 1) { showToast("編輯模式無法改為多人付款"); return; }
                if (!editingExpenseId && payers.length === 1 && formData.splitMode === 'custom') {
                    const totalInput = Object.values(formData.customDetails).reduce((a,b)=>a+parseFloat(b||0),0);
                    if (Math.abs(totalInput - inputVal) > 0.001) { showToast(`分配不符！差額需為 0`); return; }
                }
                if (payers.includes(PUBLIC_FUND_ID) && formData.splitMode === 'fund_topup') { showToast("公費不能上繳給自己"); return; }
                if (formData.involved.length === 0 && formData.splitMode !== 'fund_topup' && !(isMultiPayer && formData.splitMode === 'equal')) { showToast('請選擇分攤者'); return; }

                try {
                    await batch.commit();
                    setFormData({ 
                        title: '', inputAmount: '', currency: 'TWD', payers: [viewingUserId || INITIAL_USERS[0].id], involved: users.map(u=>u.id), splitMode: 'equal', customDetails: {}, date: new Date().toISOString().split('T')[0], amountType: 'total'
                    });
                    setEditingExpenseId(null); setActiveTab('dashboard');
                    showToast('已記下！', 'success');
                } catch (e) { showToast("儲存失敗"); }
            };

            const updateGasUrl = async (val) => {
                setSheetUrl(val);
                try { await db.collection('appSettings').doc('gasConfig').set({ url: val }); } catch (e) { console.error(e); }
            };

            const toggleInvolved = (uid) => { const cur = formData.involved; setFormData({...formData, involved: cur.includes(uid) ? (cur.length>1?cur.filter(id=>id!==uid):cur) : [...cur, uid]}); };
            const handleCustomAmountChange = (uid, val) => setFormData(p => ({...p, customDetails: {...p.customDetails, [uid]: val}}));
            
            const syncToSheet = async () => {
                if(!sheetUrl) { showToast('請先貼上 GAS 網址'); setActiveTab('settings'); return; }
                setIsSyncing(true); setSyncStatus(null);
                const payload = {
                    expenses: expenses.map(e => ({ ...e, displayAmount: e.currency==='JPY'?`¥${e.inputAmount} (約$${e.amountTwd})`:`$${e.amountTwd}`, payerName: e.payer === PUBLIC_FUND_ID ? '公費' : users.find(u=>u.id===e.payer)?.name, involvedNames: e.splitMode==='fund_topup' ? '上繳公費' : e.splitMode==='custom' ? Object.entries(e.customDetails).map(([id,v])=>`${users.find(u=>u.id===id)?.name}($${v})`).join(', ') : e.splitMode==='personal' ? '自己花' : e.involved.map(id=>users.find(u=>u.id===id)?.name).join(', ') })),
                    debts, summary: users.map(u => ({ name: u.name, share: stats.totalShare[u.id]?.toFixed(0)||0 }))
                };
                try { await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }); setTimeout(() => { setIsSyncing(false); setSyncStatus('success'); showToast('同步成功', 'success'); }, 1500); } catch (e) { setIsSyncing(false); setSyncStatus('error'); showToast('同步失敗'); }

            const handleExecuteDelete = async () => {
                const expense = confirmDelete.expense;
                if (!expense) return;
                
                try {
                    if (expense.isGroup) {
                        const batch = db.batch();
                        expense.items.forEach(item => {
                            batch.delete(db.collection('expenses').doc(item.id));
                        });
                        await batch.commit();
                    } else {
                        await db.collection('expenses').doc(expense.id).delete();
                    }
                    showToast('已刪除', 'success');

                    showToast('刪除失敗');
                } finally {
                    setConfirmDelete({ show: false, expense: null });
                }
            };

            // 渲染明細卡片邏輯
            const renderExpenseCard = (expense, isPersonal = false, isFundView = false) => {
                let isTopup = expense.splitMode === 'fund_topup';
                let isFundPay = expense.payer === PUBLIC_FUND_ID;
                let payerName = expense.payer === PUBLIC_FUND_ID ? '公費' : users.find(u=>u.id===expense.payer)?.name;
                
                let myShare = 0;
                if (expense.splitMode === 'personal') {
                    myShare = (expense.payer === viewingUserId) ? expense.amountTwd : 0;
                } else if (expense.splitMode === 'custom') {
                    myShare = parseFloat(expense.customDetails[viewingUserId] || 0);
                } else if (expense.splitMode === 'fund_topup') {
                    myShare = 0; 
                } else if (expense.involved.includes(viewingUserId)) {
                    const count = expense.involved.length;
                    myShare = Math.round(expense.amountTwd / count);
                }

                let amountToShow = isPersonal ? myShare : expense.amountTwd;
                let isPurePrepay = isPersonal && (expense.payer === viewingUserId) && (isTopup || myShare === 0);

                if (isPurePrepay) amountToShow = expense.amountTwd;
                if (isPersonal && !isPurePrepay && myShare === 0 && expense.payer !== viewingUserId) return null; 

                const getTagStyle = () => {
                    if (isTopup) return 'bg-amber-100 text-amber-700'; 
                    if (isFundPay) return 'bg-blue-100 text-blue-700';
                    if (expense.splitMode === 'personal') return 'bg-purple-100 text-purple-700';
                    return 'bg-orange-100 text-orange-700';
                };

                const getTagText = () => {
                    if (isTopup) return '上繳';
                    if (isFundPay) return '公費付';
                    if (expense.splitMode === 'personal') return '自己付';
                    return `${payerName}先付`;
                };
                
                const isFundDetailView = isFundView;

                // 按鈕渲染邏輯 (所有模式都開放)
                const ActionButtons = () => (
                    <div className="flex gap-2 relative z-10 opacity-60 hover:opacity-100 transition-opacity">
                        {/* 編輯：群組不給單筆編輯，需刪除重記 */}
                        {!expense.isGroup && (
                            <button 
                                onClick={(e) => { 
                                    e.preventDefault(); e.stopPropagation(); 
                                    setFormData({...expense, payers: [expense.payer]}); 
                                    setEditingExpenseId(expense.id); 
                                    setActiveTab('add'); 
                                }} 
                                className="p-1.5 text-slate-400 hover:text-cyan-600"
                            >
                                <Edit2 size={14}/>
                            </button>
                        )}
                        <button 
                            onClick={(e) => { 
                                e.preventDefault(); e.stopPropagation(); 
                                setConfirmDelete({ show: true, expense: expense });
                            }} 
                            className="p-1.5 text-slate-400 hover:text-red-500"
                        >
                            <Trash2 size={14}/>
                        </button>
                    </div>
                );

                if (expense.isGroup && !isPersonal) {
                    return (
                        <div key={expense.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative mb-2 animate-fade-in">
                             <div className="flex justify-between items-start mb-1">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <h4 className="font-bold text-slate-800">{expense.title}</h4>
                                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${getTagStyle()}`}>
                                            {getTagText()}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400">{new Date(expense.date).toLocaleDateString()}</p>
                                </div>
                                <div className="text-right">
                                    <div className={`font-bold text-slate-900`}>
                                        {isFundDetailView && isTopup && '+'}
                                        {isFundDetailView && isFundPay && '-'}
                                        ${expense.totalTwd.toLocaleString()}
                                    </div>
                                    <p className="text-[10px] text-slate-400">共 {expense.items.length} 人 (每人 ${expense.amountTwd})</p>
                                </div>
                             </div>
                             <div className="flex justify-between items-end">
                                <div className="text-xs text-slate-500 mt-1">
                                    {expense.groupNames}
                                </div>
                                <ActionButtons />
                             </div>
                             {expense.note && <div className="mt-2 text-xs text-slate-400 bg-slate-50 p-2 rounded">📝 {expense.note}</div>}
                        </div>
                    );
                }

                return (
                    <div key={expense.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative mb-2 animate-fade-in">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex-1 pr-12">
                                <div className="flex items-center gap-2 flex-wrap mb-1">
                                    <h4 className="font-bold text-slate-800">{expense.title}</h4>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${getTagStyle()}`}>
                                        {getTagText()}
                                    </span>
                                </div>
                                <p className="text-xs text-slate-400">{new Date(expense.date).toLocaleDateString()}</p>
                            </div>
                            <div className="text-right">
                                <div className={`font-bold flex flex-col items-end gap-0.5 text-slate-900 ${isPurePrepay ? 'opacity-50' : ''}`}>
                                    <div className="flex items-center gap-1">
                                        {isPurePrepay && '('}
                                        {isFundDetailView && isTopup && '+'}
                                        {isFundDetailView && isFundPay && '-'}
                                        {!isPersonal && expense.currency === 'JPY' && <span className="text-xs text-slate-400 font-normal">¥{expense.inputAmount} ≈</span>}
                                        ${amountToShow.toLocaleString()}
                                        {isPurePrepay && ')'}
                                    </div>
                                    {isPurePrepay && <p className="text-[10px] text-slate-400 font-medium">不計入消費</p>}
                                </div>
                            </div>
                        </div>
                        <div className="flex justify-between items-end">
                            <div className="text-xs text-slate-500 mt-1 flex-1 mr-4">
                                {isTopup ? `${payerName} 儲值進公費` :
                                 expense.splitMode === 'personal' ? `${payerName} 自己花` :
                                 expense.splitMode === 'custom' ? Object.entries(expense.customDetails).map(([uid, amt]) => `${users.find(u=>u.id===uid)?.name} $${amt}`).join('、') : 
                                 `由 ${expense.involved.map(id=>users.find(u=>u.id===id)?.name).join('、')} 平分`}
                            </div>
                            <ActionButtons />
                        </div>

                            {isSyncing ? <RefreshCw className="animate-spin w-3 h-3" /> : syncStatus === 'success' ? <CheckCircle className="w-3 h-3" /> : <FileSpreadsheet className="w-3 h-3" />}{isSyncing ? '中' : '同步'}
                        </button>
                    </header>

                    <div className="h-[76px]"></div>

                    <main className="max-w-md mx-auto p-4 space-y-5 flex-1 w-full">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4 animate-fade-in">
                                {/* 公費總覽卡片 - 提高透明度 */}

                                    <div className="flex justify-between items-center">
                                        <div>
                                            <p className="text-xs font-bold opacity-60 mb-1">公費餘額</p>
                                            <p className="text-2xl font-bold font-mono">${(Math.abs(statsView.publicFundBalance)).toLocaleString()}</p>
                                        </div>
                                        <button onClick={() => setIsFundDetailsOpen(!isFundDetailsOpen)} className="bg-white/40 p-2 rounded-lg transition-transform active:scale-95 shadow-sm text-cyan-700">
                                            {isFundDetailsOpen ? <ChevronUp size={20}/> : <ChevronDown size={20}/>}
                                        </button>
                                    </div>
                                </div>

                                {isFundDetailsOpen && (
                                    <div className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden animate-fade-in">
                                        <div className="px-5 py-4 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                                            <div className="flex items-center gap-2">
                                                <h3 className="font-bold text-slate-700 flex items-center gap-2"><Wallet className="w-4 h-4 text-slate-500" />公費收支明細</h3>
                                                <span className="text-[10px] text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-200">歷史紀錄</span>
                                            </div>
                                        </div>
                                        <div className="p-4 space-y-1 bg-white">
                                            {groupedPublicFund.length === 0 ? 
                                                <div className="text-center py-6 text-slate-400 text-sm italic">目前尚無公費紀錄</div> : 
                                                groupedPublicFund.map(e => renderExpenseCard(e, false, true))
                                            }
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white p-4 rounded-2xl border border-cyan-100 shadow-sm flex flex-col gap-2">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] ml-1">你是誰？</label>
                                    <div className="relative">
                                        <select 
                                            value={viewingUserId} 
                                            onChange={(e) => { setViewingUserId(e.target.value); setIsPersonalOpen(true); }}
                                            className="custom-select w-full bg-slate-50 border border-slate-200 text-slate-600 text-base rounded-xl p-3 appearance-none outline-none transition-all"
                                        >
                                            <option value="" disabled>請選擇</option>
                                            {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                        </select>
                                    </div>
                                </div>

                                {viewingUserId && (
                                    <div className="bg-white rounded-2xl shadow-md border border-cyan-200 overflow-hidden animate-fade-in">
                                        <button onClick={() => setIsPersonalOpen(!isPersonalOpen)} className="w-full px-5 py-4 border-b border-cyan-50 bg-cyan-50 flex justify-between items-center transition-colors">
                                            <div className="flex flex-col items-start text-left">
                                                <h3 className="font-bold text-cyan-800 flex items-center gap-2"><PieChart className="w-4 h-4 text-cyan-600" />{users.find(u=>u.id===viewingUserId)?.name}的帳本</h3>
                                                <span className="text-xs text-cyan-600">總消費價值：<span className="font-bold text-lg ml-1">${(statsView.totalShare[viewingUserId]||0).toLocaleString()}</span></span>
                                            </div>
                                            {isPersonalOpen ? <ChevronUp className="w-5 h-5 text-cyan-600" /> : <ChevronDown className="w-5 h-5 text-cyan-600" />}
                                        </button>
                                        {isPersonalOpen && <div className="p-4 space-y-1 bg-white border-t border-cyan-100">{myExpenses.length === 0 ? <div className="text-center text-slate-400 py-4 text-sm italic">目前跟你沒關係 🎉</div> : myExpenses.map(e => renderExpenseCard(e, true))}</div>}
                                    </div>
                                )}

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <button onClick={() => setIsGeneralOpen(!isGeneralOpen)} className="w-full px-5 py-4 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center transition-colors">
                                        <div className="flex items-center gap-2"><h3 className="font-bold text-slate-700 flex items-center gap-2"><LayoutDashboard className="w-4 h-4 text-slate-500" />總帳本</h3><span className="text-[10px] text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-200">所有明細</span></div>
                                        {isGeneralOpen ? <ChevronUp className="w-4 h-4 text-slate-400" /> : <ChevronDown className="w-4 h-4 text-slate-400" />}
                                    </button>
                                    {isGeneralOpen && <div className="p-4 space-y-1 bg-slate-50/30 border-t border-slate-100">{groupedExpenses.length === 0 ? <div className="text-center text-slate-400 py-4 text-sm italic">還沒有紀錄 🍃</div> : groupedExpenses.map(e => renderExpenseCard(e, false))}</div>}
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <button onClick={() => setIsDebtsOpen(!isDebtsOpen)} className="w-full px-5 py-4 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center transition-colors">
                                        <div className="flex items-center gap-2"><h3 className="font-bold text-slate-700 flex items-center gap-2"><RefreshCw className="w-4 h-4 text-slate-500" />結算建議</h3><span className="text-[10px] text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-200">收支計算</span></div>
                                        {isDebtsOpen ? <ChevronUp className="w-4 h-4 text-slate-400" /> : <ChevronDown className="w-4 h-4 text-slate-400" />}
                                    </button>
                                    {isDebtsOpen && <div className="p-5 space-y-3 bg-white border-t border-cyan-50">
                                            <div className="bg-blue-50 border border-blue-100 p-3 rounded-lg text-sm text-blue-800 mb-4">
                                                <strong className="block mb-1">💡 第一步：公費處理</strong>
                                                {statsView.publicFundBalance > 0 ? 
                                                    `公費剩餘 $${statsView.publicFundBalance.toLocaleString()}。請平分退還每人 $${Math.round(statsView.publicFundBalance/5)}，或由一人全收抵債。` :
                                                 statsView.publicFundBalance < 0 ?
                                                    `公費透支 $${Math.abs(statsView.publicFundBalance).toLocaleString()}。請每人再拿出 $${Math.round(Math.abs(statsView.publicFundBalance)/5)} 補齊。` :
                                                    "公費剛好用完，完美！"
                                                }
                                                <div className="text-xs opacity-70 mt-1">處理完公費後，再依照下方建議互轉結清。</div>
                                            </div>

                                            {debtsView.length === 0 ? <div className="text-center text-slate-400 py-4 text-sm">目前無欠款 ✨</div> : debtsView.map((d, i) => <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100"><div className="flex items-center gap-3 text-sm font-medium"><span className="text-slate-700">{d.from}</span><ArrowRight className="w-3 h-3 text-slate-400" /><span className="text-slate-700">{d.to}</span></div><span className="font-mono font-bold text-cyan-600">${d.amount}</span></div>)}</div>}
                                </div>
                            </div>
                        )}

                        {activeTab === 'add' && (
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-cyan-100 animate-fade-in-up">
                                <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">{editingExpenseId ? <Edit2 className="w-6 h-6 text-cyan-500" /> : <Plus className="w-6 h-6 text-cyan-500" />}{editingExpenseId ? '修改支出' : '新增支出'}</h2>
                                <div className="space-y-5">
                                    <div><label className="block text-sm font-medium text-slate-500 mb-1">日期</label><input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="input-standard p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 font-medium outline-none" /></div>

                                        {!isMultiPayer && (<button onClick={() => setFormData({...formData, splitMode: 'custom'})} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all whitespace-nowrap ${formData.splitMode === 'custom' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>自訂</button>)}
                                        {!isMultiPayer && !isFundPayer && (<button onClick={() => setFormData({...formData, splitMode: 'personal'})} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all whitespace-nowrap ${formData.splitMode === 'personal' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>自己花</button>)}
                                        {!isFundPayer && (<button onClick={() => setFormData({...formData, splitMode: 'fund_topup', title: '上繳公費'})} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all whitespace-nowrap ${formData.splitMode === 'fund_topup' ? 'bg-amber-100 text-amber-600 shadow' : 'text-slate-400'}`}>上繳</button>)}
                                    </div>

                                    {isMultiPayer && (formData.splitMode === 'equal' || formData.splitMode === 'fund_topup') && (
                                        <div className="flex items-center justify-between bg-slate-100 p-1 rounded-lg">
                                            <button onClick={() => setFormData(p => ({...p, amountType: 'total'}))} className={`flex-1 py-1 text-xs rounded transition-all ${formData.amountType === 'total' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>總額 ({formData.inputAmount || 0})</button>
                                            <button onClick={() => setFormData(p => ({...p, amountType: 'per_person'}))} className={`flex-1 py-1 text-xs rounded transition-all ${formData.amountType === 'per_person' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>每人 ({formData.inputAmount || 0})</button>
                                        </div>
                                    )}

                                    {formData.splitMode === 'custom' ? (
                                        <div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                            <div className="flex justify-between items-center mb-1"><label className="text-sm font-medium text-slate-600">分配 ({formData.currency})</label>{(() => { const target = parseFloat(formData.inputAmount || 0); const sum = Object.values(formData.customDetails).reduce((a,b)=>a+parseFloat(b||0),0); const diff = (target - sum).toFixed(2); return <span className={`text-xs font-bold ${Math.abs(diff) > 0.001 ? 'text-red-500' : 'text-green-600'}`}>剩餘: {diff}</span>; })()}</div>
                                            {users.map(u => <div key={u.id} className="flex items-center justify-between gap-4"><span className="text-sm text-slate-700 font-normal">{u.name}</span><input type="number" placeholder="0" value={formData.customDetails[u.id] || ''} onChange={(e) => handleCustomAmountChange(u.id, e.target.value)} className="w-24 p-2 text-right rounded-lg border border-slate-200 text-sm outline-none" /></div>)}
                                        </div>
                                    ) : formData.splitMode === 'personal' ? (
                                        <div className="text-center text-sm text-slate-500 py-4 bg-slate-50 rounded-xl border border-dashed border-slate-200">這筆錢將完全歸在付款人身上。</div>
                                    ) : formData.splitMode === 'fund_topup' ? (
                                        <div className="text-center text-sm text-slate-500 py-4 bg-amber-50 rounded-xl border border-dashed border-amber-200 text-amber-700">{formData.payers.length > 1 ? `將為 ${formData.payers.length} 位成員各建立一筆上繳紀錄。` : '這筆錢將存入公費，不計入個人消費。'}</div>
                                    ) : (
                                        <div className="flex flex-wrap gap-2">{isMultiPayer ? (<div className="text-xs text-slate-500 w-full mb-2 font-bold">已自動對應：{formData.payers.map(pid => users.find(u=>u.id===pid)?.name).join('、')}</div>) : (users.map(u => <button key={u.id} onClick={() => toggleInvolved(u.id)} className={`px-3 py-2 rounded-full text-sm border transition-all ${formData.involved.includes(u.id) ? 'border-cyan-400 bg-cyan-50 text-cyan-700' : 'border-slate-200 bg-transparent text-slate-400 font-normal'}`}>{u.name}</button>))}</div>
                                    )}

                                    <div>
                                        <label className="block text-sm font-medium text-slate-500 mb-1">備註</label>
                                        <input type="text" value={formData.note || ''} onChange={e => setFormData({...formData, note: e.target.value})} className="input-standard p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" placeholder="" />
                                    </div>

                                    <div className="pt-4"><button onClick={saveExpense} className="w-full py-4 bg-cyan-500 text-white rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2"><Save className="w-5 h-5" />{editingExpenseId ? '儲存修改' : '記下來'}</button></div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'settings' && (
                            <div className="space-y-6 animate-fade-in shrink-0">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-cyan-100"><h3 className="font-bold text-cyan-800 mb-3 flex items-center gap-2"><Globe className="w-4 h-4 text-cyan-600"/>匯率 (JPY → TWD)</h3><div className="flex items-center gap-4 bg-slate-50 p-4 rounded-xl text-sm"><span>1 日幣 =</span><input type="number" step="0.001" value={exchangeRate} onChange={e => setExchangeRate(e.target.value)} className="w-20 p-2 text-center font-bold text-slate-800 border border-slate-200 rounded-lg outline-none" /><span>台幣</span></div></div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100"><h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Users className="w-4 h-4 text-cyan-500"/>成員名單</h3><div className="space-y-2">{users.map(u => <div key={u.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-cyan-100 flex items-center justify-center text-cyan-600 font-bold text-xs">{u.name[0]}</div><span className="font-normal">{u.name}</span></div></div>)}</div></div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 opacity-90 text-left">
                                    <div className="flex flex-col gap-1">
                                        <h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm"><FileSpreadsheet className="w-4 h-4 text-slate-400" />Google Sheet 連動</h3>
                                        <input type="text" value={sheetUrl} onChange={e => updateGasUrl(e.target.value)} placeholder="貼上 GAS 網址" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono outline-none" />
                                        <div className="mt-1 text-left">
                                            <a href="https://docs.google.com/spreadsheets/d/19nQPjoqHKST3qQothDmyoKM01EDIAPiCUeFHmUkV21E/edit?gid=2086443444#gid=2086443444" target="_blank" className="text-slate-900 text-[10px] underline underline-offset-4 decoration-slate-300">沖繩平安歐</a>
                                        </div>
                                    </div>
                                </div>
                                <div className="text-center text-[10px] text-slate-300 pb-8">v3.7 - 全面編輯權限與清透介面</div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 flex justify-between z-[100] pb-[env(safe-area-inset-bottom)] shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                        <TabButton id="dashboard" label="儀表板" icon={LayoutDashboard} />
                        <div className="relative -top-5 flex justify-center">
                            <button onClick={() => setActiveTab('add')} className="bg-cyan-500 text-white p-4 rounded-full shadow-xl hover:bg-cyan-600 transition-all border-4 border-slate-50 active:scale-90"><Plus size={28} /></button>
                        </div>
                        <TabButton id="settings" label="設定" icon={Settings} />
                    </nav>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
