<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>平凡去沖繩</title>
    
    <!-- 1. 引入程式庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script>
        window.react = window.React;
        window['react-dom'] = window.ReactDOM;
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        
        /* 統一輸入框樣式，解決不同 type 導致的長度差異 */
        .input-standard {
            width: 100% !important;
            display: block;
            appearance: none;
            -webkit-appearance: none;
            box-sizing: border-box;
        }

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #f8fafc; color: #64748b; z-index: 1000; flex-direction: column; text-align: center; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="loading-screen">
        <p class="text-xl font-bold mb-2">正在載入沖繩之旅...🌊</p>
        <p class="text-xs">四年啦四年！？</p>
    </div>

    <script type="text/babel">
        const removeLoading = () => {
            const el = document.getElementById('loading-screen');
            if(el) el.style.display = 'none';
        };

        const firebaseConfig = {
            apiKey: "AIzaSyA5MRIK9yxJ_XNRIfgnLdXjRBoLFQWr8o0",
            authDomain: "okinawa-financial-sheet.firebaseapp.com",
            projectId: "okinawa-financial-sheet",
            storageBucket: "okinawa-financial-sheet.firebasestorage.app",
            messagingSenderId: "1032242385806",
            appId: "1:1032242385806:web:7fa5753a22d4e45f934adf",
            measurementId: "G-33EEBGS9F3"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useMemo } = React;

        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Plus: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>,
            Trash2: (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>,
            Users: (p) => <IconBase {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            LayoutDashboard: (p) => <IconBase {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconBase>,
            Edit2: (p) => <IconBase {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>,
            Settings: (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            Globe: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></IconBase>,
            RefreshCw: (p) => <IconBase {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>,
            CheckCircle: (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            FileSpreadsheet: (p) => <IconBase {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></IconBase>,
            HelpCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></IconBase>,
            X: (p) => <IconBase {...p}><path d="M18 6 6 18"/><path d="M6 6 18 18"/></IconBase>,
            PieChart: (p) => <IconBase {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>,
            ArrowRight: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></IconBase>,
            ChevronDown: (p) => <IconBase {...p}><path d="m6 9 6 6 6-6"/></IconBase>,
            ChevronUp: (p) => <IconBase {...p}><path d="m18 15-6-6-6 6"/></IconBase>,
            Save: (p) => <IconBase {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>
        };
        const { Plus, Trash2, Users, LayoutDashboard, Edit2, Settings, Globe, RefreshCw, CheckCircle, FileSpreadsheet, HelpCircle, X, PieChart, ArrowRight, ChevronDown, ChevronUp, Save } = Icons;

        const INITIAL_USERS = [ { id: '1', name: '陳浚愷' }, { id: '2', name: '許瀅珊' }, { id: '3', name: '黃韻庭' }, { id: '4', name: '楊予瑄' }, { id: '5', name: '侯宇薪' } ];

        function App() {
            const [users, setUsers] = useState(INITIAL_USERS);
            const [expenses, setExpenses] = useState([]); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currentUser, setCurrentUser] = useState(null);
            const [authError, setAuthError] = useState(null);
            const [exchangeRate, setExchangeRate] = useState(0.22);
            const [isFetchingRate, setIsFetchingRate] = useState(false);
            const [isStatsOpen, setIsStatsOpen] = useState(false);
            const [isDebtsOpen, setIsDebtsOpen] = useState(false);
            const [editingExpenseId, setEditingExpenseId] = useState(null);
            const [editingUserId, setEditingUserId] = useState(null);
            const [tempUserName, setTempUserName] = useState('');
            const [formData, setFormData] = useState({
                title: '', inputAmount: '', currency: 'TWD', payer: '1', involved: INITIAL_USERS.map(u=>u.id), splitMode: 'equal', customDetails: {}, date: new Date().toISOString().split('T')[0]
            });
            const [sheetUrl, setSheetUrl] = useState(''); 
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState(null); 

            useEffect(() => {
                removeLoading();
                auth.signInAnonymously().catch((error) => {
                    console.error("Auth Failed:", error);
                    setAuthError("請開啟 Firebase 匿名登入功能。");
                });
                return auth.onAuthStateChanged((user) => {
                    setCurrentUser(user);
                    if (user) setAuthError(null);
                });
            }, []);

            useEffect(() => {
                if (!currentUser) return;
                const unsubExpenses = db.collection('expenses')
                    .onSnapshot((snapshot) => {
                        let newExpenses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        newExpenses.sort((a, b) => {
                            const dateA = a.date || ''; const dateB = b.date || '';
                            if (dateB !== dateA) return dateB.localeCompare(dateA);
                            return (b.createdAt || '').localeCompare(a.createdAt || '');
                        });
                        setExpenses(newExpenses);
                    });
                const unsubSettings = db.collection('appSettings').doc('gasConfig')
                    .onSnapshot((doc) => { if (doc.exists) { setSheetUrl(doc.data().url || ''); } });
                return () => { unsubExpenses(); unsubSettings(); };
            }, [currentUser]);

            useEffect(() => {
                const fetchRate = async () => {
                    setIsFetchingRate(true);
                    try {
                        const res = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                        const data = await res.json();
                        if (data?.rates?.TWD) setExchangeRate(data.rates.TWD);
                    } catch (e) { console.error(e); } finally { setIsFetchingRate(false); }
                };
                fetchRate();
            }, []);

            const stats = useMemo(() => {
                const bal = {}; const share = {};
                users.forEach(u => { bal[u.id] = 0; share[u.id] = 0; });
                expenses.forEach(exp => {
                    const paidBy = exp.payer; const amountTwd = parseFloat(exp.amountTwd || 0);
                    if (bal[paidBy] !== undefined) bal[paidBy] += amountTwd;
                    if (exp.splitMode === 'custom' && exp.customDetails) {
                        Object.entries(exp.customDetails).forEach(([uid, val]) => {
                            const s = parseFloat(val);
                            if (share[uid] !== undefined) { share[uid] += s; bal[uid] -= s; }
                        });
                    } else {
                        const count = exp.involved.length; const split = amountTwd / count;
                        exp.involved.forEach(uid => { if (share[uid] !== undefined) { share[uid] += split; bal[uid] -= split; } });
                    }
                });
                return { balances: bal, totalShare: share };
            }, [users, expenses]);

            const debts = useMemo(() => {
                let debtors = []; let creditors = [];
                Object.entries(stats.balances).forEach(([id, amt]) => {
                    const r = Math.round(amt);
                    if (r < -1) debtors.push({ id, amount: r });
                    if (r > 1) creditors.push({ id, amount: r });
                });
                debtors.sort((a,b) => a.amount - b.amount); creditors.sort((a,b) => b.amount - a.amount);
                const txs = []; let i=0; let j=0;
                while(i < debtors.length && j < creditors.length) {
                    const d = debtors[i]; const c = creditors[j];
                    const amt = Math.min(Math.abs(d.amount), c.amount);
                    if (amt > 0) txs.push({ from: users.find(u=>u.id===d.id)?.name, to: users.find(u=>u.id===c.id)?.name, amount: amt.toFixed(0) });
                    d.amount += amt; c.amount -= amt;
                    if (Math.abs(d.amount) < 1) i++; if (c.amount < 1) j++;
                }
                return txs;
            }, [stats.balances, users]);

            const saveExpense = async () => {
                if (!formData.title || !formData.inputAmount) { alert('請輸入項目和金額'); return; }
                const inputVal = parseFloat(formData.inputAmount);
                const finalTwd = formData.currency === 'JPY' ? Math.round(inputVal * exchangeRate) : inputVal;
                const dataPayload = { ...formData, amountTwd: finalTwd, updatedAt: new Date().toISOString() };
                try {
                    if (editingExpenseId) await db.collection('expenses').doc(editingExpenseId).update(dataPayload);
                    else await db.collection('expenses').add({ ...dataPayload, createdAt: new Date().toISOString() });
                    setFormData({ title: '', inputAmount: '', currency: 'TWD', payer: users[0]?.id||'1', involved: users.map(u=>u.id), splitMode: 'equal', customDetails: {}, date: new Date().toISOString().split('T')[0] });
                    setEditingExpenseId(null);
                    setActiveTab('dashboard');
                } catch (error) { alert("儲存失敗：" + error.message); }
            };

            const updateGasUrl = async (val) => {
                setSheetUrl(val);
                try { await db.collection('appSettings').doc('gasConfig').set({ url: val }); } catch (e) { console.error(e); }
            };

            const toggleInvolved = (uid) => { const cur = formData.involved; setFormData({...formData, involved: cur.includes(uid) ? (cur.length>1?cur.filter(id=>id!==uid):cur) : [...cur, uid]}); };
            const handleCustomAmountChange = (uid, val) => setFormData(p => ({...p, customDetails: {...p.customDetails, [uid]: val}}));
            
            const syncToSheet = async () => {
                if(!sheetUrl) { alert('請先設定 GAS 網址'); setActiveTab('settings'); return; }
                setIsSyncing(true); setSyncStatus(null);
                const payload = {
                    expenses: expenses.map(e => ({ ...e, displayAmount: e.currency==='JPY'?`¥${e.inputAmount} (約$${e.amountTwd})`:`$${e.amountTwd}`, payerName: users.find(u=>u.id===e.payer)?.name, involvedNames: e.splitMode==='custom' ? Object.entries(e.customDetails).map(([id,v])=>`${users.find(u=>u.id===id)?.name}($${v})`).join(', ') : e.involved.map(id=>users.find(u=>u.id===id)?.name).join(', ') })),
                    debts, summary: users.map(u => ({ name: u.name, share: stats.totalShare[u.id]?.toFixed(0)||0 }))
                };
                try { await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }); setTimeout(() => { setIsSyncing(false); setSyncStatus('success'); }, 1500); } catch (e) { setIsSyncing(false); setSyncStatus('error'); }
            };

            const TabButton = ({ id, label, icon: Icon }) => (
                <button onClick={() => { setActiveTab(id); if(id==='add'){ setEditingExpenseId(null); setFormData({...formData, title: '', inputAmount: ''}); } }} className={`flex flex-col items-center justify-center py-3 px-1 flex-1 transition-colors ${activeTab === id ? 'text-cyan-600 border-t-2 border-cyan-600 bg-cyan-50' : 'text-slate-400 hover:text-cyan-500'}`}>
                    <Icon size={20} className="mb-1" /><span className="text-xs font-medium">{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
                    <header className="bg-white shadow-sm px-6 py-4 sticky top-0 z-10 flex justify-between items-center border-b border-cyan-100 shrink-0">
                        <div><h1 className="text-xl font-bold text-cyan-700 flex items-center gap-2"><span>平凡去沖繩</span> 🌊</h1><p className="text-xs text-cyan-500/80 font-bold text-slate-500">四年啦四年！？明年就五年啦！</p></div>
                        <button onClick={syncToSheet} disabled={isSyncing} className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm transition-all ${syncStatus === 'success' ? 'bg-green-100 text-green-700' : syncStatus === 'error' ? 'bg-red-100 text-red-700' : 'bg-cyan-500 text-white hover:bg-cyan-600'}`}>
                            {isSyncing ? <RefreshCw className="animate-spin w-3 h-3" /> : syncStatus === 'success' ? <CheckCircle className="w-3 h-3" /> : <FileSpreadsheet className="w-3 h-3" />}{isSyncing ? '同步中' : syncStatus === 'success' ? '已更新' : '同步至 Sheet'}
                        </button>
                    </header>

                    <main className="max-w-md mx-auto p-4 space-y-6 flex-1 w-full overflow-y-auto">
                        {authError && <div className="bg-red-50 p-4 rounded-xl border border-red-200 text-red-700 text-sm mb-4"><strong>⚠️ 系統訊息</strong><br/>{authError}</div>}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center px-2"><h3 className="font-bold text-cyan-800 flex items-center gap-2"><LayoutDashboard className="w-4 h-4" />消費明細</h3><span className="text-xs text-slate-400">共 {expenses.length} 筆</span></div>
                                    {expenses.length === 0 && !authError && <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200"><p className="text-slate-400 text-sm">還沒有紀錄，快去吃沖繩麵！🍜</p><button onClick={() => setActiveTab('add')} className="mt-4 text-cyan-500 text-sm font-bold hover:underline">+ 新增第一筆</button></div>}
                                    {expenses.map(expense => (
                                        <div key={expense.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 hover:border-cyan-200 transition-colors"><div className="flex justify-between items-start mb-2"><div className="flex-1"><div className="flex items-center gap-2"><h4 className="font-bold text-slate-800">{expense.title}</h4><span className="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full">{users.find(u=>u.id===expense.payer)?.name}先付</span></div><p className="text-xs text-slate-400 mt-1">{new Date(expense.date).toLocaleDateString()}</p></div><div className="text-right"><div className="font-bold text-slate-900 flex items-center justify-end gap-1">{expense.currency === 'JPY' && <span className="text-xs text-slate-400 font-normal">¥{expense.inputAmount} ≈</span>}${expense.amountTwd}</div><div className="flex gap-2 justify-end mt-2"><button onClick={() => { setFormData({...expense}); setEditingExpenseId(expense.id); setActiveTab('add'); }} className="p-1.5 text-slate-400 hover:text-cyan-600 bg-slate-50 rounded-full transition-colors"><Edit2 size={14}/></button><button onClick={async (e) => { e.stopPropagation(); if(confirm('刪？')){ await db.collection('expenses').doc(expense.id).delete(); }}} className="p-1.5 text-slate-400 hover:text-red-500 bg-slate-50 rounded-full transition-colors"><Trash2 size={14}/></button></div></div></div><div className="text-xs text-slate-500 bg-slate-50/80 p-2 rounded-lg mt-1">{expense.splitMode === 'custom' ? Object.entries(expense.customDetails).map(([uid, amt]) => `${users.find(u=>u.id===uid)?.name} $${amt}`).join('、') : `由 ${expense.involved.map(id=>users.find(u=>u.id===id)?.name).join('、')} 平分`}</div></div>
                                    ))}
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-cyan-100 overflow-hidden"><button onClick={() => setIsDebtsOpen(!isDebtsOpen)} className="w-full px-5 py-3 border-b border-cyan-50 bg-cyan-50/30 flex justify-between items-center transition-colors hover:bg-cyan-50"><div className="flex items-center gap-2"><h3 className="font-bold text-cyan-800 flex items-center gap-2"><RefreshCw className="w-4 h-4 text-cyan-500" />結算建議</h3><span className="text-[10px] text-cyan-400 bg-white px-2 py-0.5 rounded-full border border-cyan-100">誰該給誰錢</span></div>{isDebtsOpen ? <ChevronUp className="w-4 h-4 text-cyan-400" /> : <ChevronDown className="w-4 h-4 text-cyan-400" />}</button>{isDebtsOpen && <div className="p-5 space-y-3 animate-fade-in">{debts.length === 0 ? <div className="text-center text-slate-400 py-2 text-sm">目前無欠款 ✨</div> : debts.map((d, i) => <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100"><div className="flex items-center gap-3 text-sm"><span className="font-bold text-slate-700">{d.from}</span><ArrowRight className="w-3 h-3 text-slate-400" /><span className="font-bold text-slate-700">{d.to}</span></div><span className="font-mono font-bold text-cyan-600">${d.amount}</span></div>)}</div>}</div>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"><button onClick={() => setIsStatsOpen(!isStatsOpen)} className="w-full flex justify-between items-center p-4 bg-slate-50 hover:bg-slate-100 transition-colors"><h3 className="font-bold text-slate-700 flex items-center gap-2"><PieChart className="w-4 h-4 text-slate-500"/>個人總消費統計 (TWD)</h3>{isStatsOpen ? <ChevronUp className="w-4 h-4 text-cyan-400" /> : <ChevronDown className="w-4 h-4 text-cyan-400" />}</button>{isStatsOpen && <div className="p-5 space-y-3 bg-white animate-fade-in"><p className="text-xs text-slate-400 mb-2">每個人「實際消費」的價值：</p>{users.map(u => <div key={u.id} className="flex justify-between items-center py-2 border-b border-slate-50 last:border-0"><span className="font-medium text-slate-700">{u.name}</span><span className="font-mono font-bold text-slate-800">${(stats.totalShare[u.id]||0).toLocaleString()}</span></div>)}</div>}</div>
                            </div>
                        )}
                        {activeTab === 'add' && (
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-cyan-100 animate-fade-in-up shrink-0">
                                <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">{editingExpenseId ? <Edit2 className="w-6 h-6 text-cyan-500" /> : <Plus className="w-6 h-6 text-cyan-500" />}{editingExpenseId ? '修改支出' : '新增一筆'}</h2>
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-500 mb-1">日期</label>
                                        <input 
                                            type="date" 
                                            value={formData.date} 
                                            onChange={e => setFormData({...formData, date: e.target.value})} 
                                            className="input-standard p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all text-slate-700 font-medium" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-500 mb-1">項目</label>
                                        <input 
                                            type="text" 
                                            value={formData.title} 
                                            onChange={e => setFormData({...formData, title: e.target.value})} 
                                            placeholder="沖繩麵、潛水..."
                                            className="input-standard p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all" 
                                        />
                                    </div>
                                    <div><label className="block text-sm font-medium text-slate-500 mb-1">金額</label><div className="flex gap-2"><div className="relative flex-1"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-bold">{formData.currency === 'JPY' ? '¥' : '$'}</span><input type="number" value={formData.inputAmount} onChange={e => setFormData({...formData, inputAmount: e.target.value})} placeholder="0" className="w-full pl-8 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 font-mono text-lg" /></div><div className="flex bg-slate-100 p-1 rounded-xl"><button onClick={() => setFormData({...formData, currency: 'TWD'})} className={`px-3 text-xs font-bold rounded-lg transition-all ${formData.currency === 'TWD' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>TWD</button><button onClick={() => setFormData({...formData, currency: 'JPY'})} className={`px-3 text-xs font-bold rounded-lg transition-all ${formData.currency === 'JPY' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>JPY</button></div></div>{formData.currency === 'JPY' && formData.inputAmount && <p className="text-xs text-cyan-600 mt-2 text-right">× {exchangeRate} ≈ <span className="font-bold text-sm">TWD ${Math.round(formData.inputAmount * exchangeRate)}</span></p>}</div>
                                    <div><label className="block text-sm font-medium text-slate-500 mb-2">誰先付錢？</label><div className="flex flex-wrap gap-2">{users.map(u => <button key={u.id} onClick={() => setFormData({...formData, payer: u.id})} className={`px-3 py-2 rounded-full text-sm transition-all ${formData.payer === u.id ? 'bg-cyan-500 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{u.name}</button>)}</div></div>
                                    <div className="bg-slate-50 p-1 rounded-xl flex"><button onClick={() => setFormData({...formData, splitMode: 'equal'})} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${formData.splitMode === 'equal' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>平分</button><button onClick={() => setFormData({...formData, splitMode: 'custom'})} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${formData.splitMode === 'custom' ? 'bg-white shadow text-cyan-600' : 'text-slate-400'}`}>自訂金額 (TWD)</button></div>
                                    {formData.splitMode === 'equal' ? (<div><label className="block text-sm font-medium text-slate-500 mb-2">分給誰？</label><div className="flex flex-wrap gap-2">{users.map(u => <button key={u.id} onClick={() => toggleInvolved(u.id)} className={`px-3 py-2 rounded-full text-sm border transition-all ${formData.involved.includes(u.id) ? 'border-cyan-400 bg-cyan-50 text-cyan-700' : 'border-slate-200 bg-transparent text-slate-400'}`}>{u.name}</button>)}</div></div>) : (<div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200"><div className="flex justify-between items-center mb-2"><label className="text-sm font-medium text-slate-600">分配 (台幣)</label></div>{users.map(u => <div key={u.id} className="flex items-center justify-between"><span className="text-sm text-slate-700">{u.name}</span><input type="number" placeholder="0" value={formData.customDetails[u.id] || ''} onChange={(e) => handleCustomAmountChange(u.id, e.target.value)} className="w-24 p-2 text-right rounded-lg border border-slate-200 focus:outline-none focus:border-cyan-500 text-sm" /></div>)}</div>)}
                                    <div className="flex gap-3 mt-6"><button onClick={saveExpense} className="flex-1 py-4 bg-cyan-500 text-white rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2"><Save className="w-5 h-5" />{editingExpenseId ? '儲存修改' : '記下來'}</button></div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'settings' && (
                            <div className="space-y-6 animate-fade-in shrink-0">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-cyan-100"><h3 className="font-bold text-cyan-800 mb-3 flex items-center gap-2"><Globe className="w-4 h-4 text-cyan-500"/>匯率設定 (JPY → TWD)</h3><div className="flex items-center gap-4 bg-slate-50 p-4 rounded-xl"><div className="text-sm text-slate-500">1 日幣 = </div><input type="number" step="0.001" value={exchangeRate} onChange={e => setExchangeRate(e.target.value)} className="w-20 p-2 text-center font-bold text-slate-800 border border-slate-200 rounded-lg focus:outline-none focus:border-cyan-500" /><div className="text-sm text-slate-500">台幣</div></div></div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100"><h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Users className="w-4 h-4 text-slate-500"/>成員名單</h3><div className="space-y-2">{users.map(u => <div key={u.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg group"><div className="flex items-center gap-3 flex-1"><div className="w-8 h-8 rounded-full bg-cyan-100 flex items-center justify-center text-cyan-600 font-bold text-xs">{u.name[0]}</div>{editingUserId === u.id ? <input autoFocus type="text" value={tempUserName} onChange={e => setTempUserName(e.target.value)} onBlur={() => { if(tempUserName.trim()) setUsers(users.map(us=>us.id===editingUserId?{...us,name:tempUserName}:us)); setEditingUserId(null); }} className="flex-1 bg-white border border-cyan-300 rounded px-2 py-1 text-sm outline-none" /> : <span onClick={() => {setEditingUserId(u.id); setTempUserName(u.name);}} className="cursor-pointer hover:text-cyan-600 transition-colors flex-1">{u.name}</span>}</div></div>)}</div></div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 opacity-90"><h3 className="font-bold text-slate-700 flex items-center gap-2 mb-3"><FileSpreadsheet className="w-4 h-4 text-slate-400" />Google Sheet 連動</h3><input type="text" value={sheetUrl} onChange={e => updateGasUrl(e.target.value)} placeholder="貼上 GAS 網址" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs mb-3 font-mono" /></div>
                                <div className="text-center text-[10px] text-slate-300 mt-4 pb-8">v1.3 - 視覺優化版</div>
                            </div>
                        )}
                    </main>

                    {/* 導航列：移除 excess padding，讓畫面更緊湊 */}
                    <nav className="sticky bottom-0 w-full max-w-md mx-auto bg-white/95 backdrop-blur-sm border-t border-slate-200 px-2 flex justify-between z-20 pb-[env(safe-area-inset-bottom)] shadow-[0_-5px_15px_rgba(0,0,0,0.03)] shrink-0">
                        <TabButton id="dashboard" label="儀表板" icon={LayoutDashboard} />
                        <div className="relative -top-5 flex justify-center">
                            <button onClick={() => setActiveTab('add')} className="bg-cyan-500 text-white p-4 rounded-full shadow-xl hover:bg-cyan-600 transition-all border-4 border-slate-50 active:scale-90"><Plus size={28} /></button>
                        </div>
                        <TabButton id="settings" label="設定" icon={Settings} />
                    </nav>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
